[package]
name                  = "celox-frontend"
version.workspace     = true
authors.workspace     = true
repository.workspace  = true
license.workspace     = true
description           = "Shared frontend assembly and HDL source adapters for Celox"
edition.workspace     = true

[features]
systemverilog = ["dep:celox-sv-analyzer"]

[dependencies]
tracing = { workspace = true }
bit-set        = { workspace = true }
celox-design   = { path = "../celox-design" }
celox-sir      = { path = "../celox-sir" }
celox-slt      = { path = "../celox-slt" }
celox-testbench = { path = "../celox-testbench" }
celox-sv-analyzer = { path = "../celox-sv-analyzer", optional = true }
fxhash         = { workspace = true }
miette         = { workspace = true }
num-bigint     = { workspace = true }
num-traits     = { workspace = true }
thiserror      = { workspace = true }
veryl-analyzer = { workspace = true }
veryl-metadata = { workspace = true }
veryl-parser   = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
