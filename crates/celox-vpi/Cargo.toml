[package]
name                  = "celox-vpi"
version.workspace     = true
publish               = false
authors.workspace     = true
repository.workspace  = true
license.workspace     = true
description.workspace = true
edition.workspace     = true

[features]
cranelift = ["celox/cranelift"]
wasm-runtime = ["celox/wasm-runtime"]
wasm-component = ["celox/wasm-component"]
default = ["systemverilog"]
arm64-codegen = ["celox/arm64-codegen"]
x86_64-codegen = ["celox/x86_64-codegen"]
systemverilog = ["celox/systemverilog", "dep:celox-sv-analyzer"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "celox-vpi-runtime"
path = "src/bin/runtime.rs"

[[bin]]
name = "celox-vpi-compile"
path = "src/bin/compile.rs"

[[bin]]
# The API library also renders to target/doc/celox; do not overwrite it.
doc = false
name = "celox"
path = "src/bin/celox.rs"

[target.'cfg(target_arch = "x86_64")'.dependencies]
celox = { path = "../celox", features = ["systemverilog"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
celox = { path = "../celox", features = ["systemverilog"] }

[dependencies]
blake3 = "1.8"
celox-frontend-veryl = { path = "../celox-frontend-veryl" }
libc.workspace = true
pathdiff = "0.2"
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
celox-design.workspace = true
celox-sv-analyzer = { workspace = true, optional = true }
clap.workspace = true
fxhash.workspace = true
libloading = "0.9"
serde.workspace = true
toml.workspace = true
veryl-metadata.workspace = true



[lints]
workspace = true
