[package]
name                  = "celox-vpi"
version.workspace     = true
publish               = false
authors.workspace     = true
repository.workspace  = true
license.workspace     = true
description.workspace = true
edition.workspace     = true

[features]
default = ["systemverilog"]
systemverilog = ["celox/systemverilog", "dep:celox-sv-analyzer"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "celox-vpi-runtime"
path = "src/bin/runtime.rs"

[[bin]]
name = "celox-vpi-compile"
path = "src/bin/compile.rs"

[[bin]]
# The API library also renders to target/doc/celox; do not overwrite it.
doc = false
name = "celox"
path = "src/bin/celox.rs"

[target.'cfg(target_arch = "x86_64")'.dependencies]
celox = { path = "../celox", features = ["systemverilog"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
celox = { path = "../celox", features = ["systemverilog"] }

[dependencies]
celox-design.workspace = true
celox-sv-analyzer = { workspace = true, optional = true }
clap.workspace = true
fxhash.workspace = true
libloading = "0.9"
serde.workspace = true
toml.workspace = true
veryl-metadata.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
