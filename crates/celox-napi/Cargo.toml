[package]
name                  = "celox-napi"
version.workspace     = true
publish               = false
authors.workspace     = true
repository.workspace  = true
license.workspace     = true
description.workspace = true
edition.workspace     = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi              = { version = "=3.12.0", features = ["napi8", "serde-json"] }
napi-derive       = "=3.6.1"
celox-ts-gen      = { path = "../celox-ts-gen" }
veryl-analyzer    = { workspace = true }
veryl-metadata    = { workspace = true }
veryl-parser      = { workspace = true }
veryl-path        = { workspace = true }
miette            = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
toml              = { workspace = true }
globset           = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
celox = { path = "../celox" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
celox = { path = "../celox", default-features = false }

[build-dependencies]
napi-build = "=2.4.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
