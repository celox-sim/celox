[package]
name                  = "celox"
version.workspace     = true
publish               = ["crates-io"]
authors.workspace     = true
repository.workspace  = true
license.workspace     = true
description.workspace = true
readme                = "README.md"
edition.workspace     = true
rust-version.workspace = true

[features]
default = ["host-runtime"]
host-runtime = [
    "dep:celox-backend-x86",
    "dep:celox-macros",
    "dep:veryl-component-sys",
    "dep:libloading",
    "rand/thread_rng",
    "celox-sir-opt/timing",
]
cranelift = ["host-runtime", "dep:celox-backend-cranelift"]
wasm-runtime = ["host-runtime", "dep:wasmtime"]
veryl-reference = ["host-runtime", "dep:veryl-simulator"]
wasm-component = ["host-runtime", "dep:wasmtime"]
systemverilog = ["dep:celox-frontend-sv"]
# Accept SystemVerilog DPI-C imports, linked to C functions at build time.
sv-dpi = ["systemverilog", "celox-frontend-sv/dpi"]
arm64-codegen = ["cranelift", "dep:celox-backend-arm64"]
x86_64-codegen = [
    "cranelift",
    "dep:celox-backend-x86",
    "celox-backend-x86/cross-codegen",
]

[dependencies]
veryl-simulator = { workspace = true, optional = true }
celox-backend-common = { workspace = true }
toml                  = { workspace = true }
veryl-analyzer        = { workspace = true }
veryl-metadata        = { workspace = true }
veryl-parser          = { workspace = true }
veryl-path            = { workspace = true }
veryl-component-sys   = { version = "0.1.2", optional = true }
libloading            = { version = "0.9", optional = true }
celox-analysis        = { workspace = true }
celox-backend-wasm    = { workspace = true }
celox-design          = { workspace = true }
celox-frontend-core   = { workspace = true }
celox-frontend-sdk    = { workspace = true }
celox-frontend-sv     = { workspace = true, optional = true }
celox-frontend-veryl  = { workspace = true }
celox-sir             = { workspace = true }
celox-sir-opt         = { workspace = true, default-features = false }
celox-slt             = { workspace = true }
celox-state-layout    = { workspace = true }
celox-runtime         = { workspace = true }
celox-heap            = { workspace = true }
celox-testbench       = { workspace = true }
fxhash                = { workspace = true }
thiserror             = { workspace = true }
clap                  = { workspace = true }
miette                = { workspace = true }
num-bigint            = "0.5"
rand                  = { workspace = true }
rand_pcg              = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
postcard              = { version = "1.1", features = ["alloc"] }
num-traits            = { workspace = true }
bit-set               = { workspace = true }
itertools             = { workspace = true }
tracing               = { workspace = true }
celox-macros          = { workspace = true, optional = true }
celox-backend-cranelift = { workspace = true, optional = true }
celox-backend-arm64   = { workspace = true, optional = true }
wasmtime              = { version = "50", optional = true }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
celox-backend-x86     = { workspace = true, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
celox-sir-opt         = { workspace = true, default-features = false, features = ["wide-native-memory"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
celox-backend-arm64   = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
celox-test-suite = { workspace = true, features = ["emit"] }
celox-sv-analyzer = { workspace = true }
insta      = "1.46"
libc.workspace = true
criterion  = "0.8"
codspeed-criterion-compat = "6.0.0"
proptest   = "1.10"
test-case  = "3"
tempfile.workspace = true
veryl-std = { workspace = true }
veryl-emitter = { workspace = true }
vcd = "0.7"

[[bench]]
name = "vcd"
required-features = ["cranelift"]
harness = false

[[bench]]
name = "simulation"
harness = false

[[bench]]
name = "overhead"
harness = false

[[test]]
name = "systemverilog"
path = "tests/systemverilog.rs"
required-features = ["systemverilog", "cranelift", "wasm-runtime"]

[[test]]
name = "sv_dpi"
path = "tests/sv_dpi.rs"
required-features = ["sv-dpi", "cranelift", "wasm-runtime"]

[[bench]]
name = "compilation"
required-features = ["cranelift"]
harness = false
bench = false

[[bench]]
name = "tiered"
harness = false

[[example]]
name = "sv_tests"
path = "examples/sv_tests.rs"
required-features = ["systemverilog"]

[[example]]
name = "sched_bench"
path = "examples/sched_bench.rs"
required-features = ["systemverilog"]

[[example]]
name = "frontend_binary"
path = "examples/frontend_binary.rs"
required-features = ["host-runtime"]

[[example]]
name = "vtest-exec"
required-features = ["host-runtime"]

