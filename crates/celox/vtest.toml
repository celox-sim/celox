# The Celox backends each celox-test-suite case runs on. scripts/run-vtest.py
# reads this file and runs the `vtest-exec` example once per case and backend;
# no Rust test registers the cases.
#
# A case runs on the `backends` of its language, changed first by its group's
# entry and then by its own:
#
# - `add`: backends beyond those, such as `native-image`, `native-baseline`
#   or `interpreter`;
# - `omit`: backends the case does not apply to, which never run it;
# - `ignore`: backends that cannot run the case yet. The runner reports them
#   as ignored and runs them only with `--ignored include` or `--ignored only`;
# - `reason`: why the case is ignored.
#
# Entries must name existing groups, cases and backends: the runner rejects
# a stale one. A case without an entry runs on its group's backends.

[veryl]
backends = ["native", "native-parallel", "cranelift", "cranelift-parallel", "wasm", "interp", "sv", "veryl"]

[veryl.groups.case_switch]
add = ["native-baseline"]

[veryl.groups.compare_matrix]
add = ["native-baseline"]

[veryl.groups.four_state]
add = ["native-baseline"]

[veryl.groups.linear_sorter_pull]
add = ["native-baseline"]

[veryl.groups.multi_clock]
add = ["native-baseline"]

[veryl.groups.nba_dynamic_array]
add = ["native-baseline"]

[veryl.groups.operators]
add = ["native-baseline"]

[veryl.groups.signed_divrem]
add = ["native-baseline"]

[veryl.groups.std_fifo]
add = ["native-baseline"]

[veryl.groups.std_ram]
add = ["native-baseline"]

[veryl.groups.synth_dynamic_loop]
add = ["native-baseline"]

[veryl.groups.wide_operators]
add = ["native-baseline"]

[veryl.groups.wide_shift_mem]
add = ["native-baseline"]

