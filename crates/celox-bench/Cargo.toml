[package]
name                  = "celox-bench"
version.workspace     = true
publish               = false
authors.workspace     = true
repository.workspace  = true
license.workspace     = true
description           = "Macro-benchmark runners for Celox"
edition.workspace     = true

[features]
default = []
arm64-codegen = ["celox/arm64-codegen"]
x86_64-codegen = ["celox/x86_64-codegen"]

[dependencies]
celox           = { path = "../celox" }
clap            = { workspace = true }
fxhash          = { workspace = true }
libc            = { workspace = true }
object          = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
serde           = { workspace = true }
serde_json      = { workspace = true }
tempfile        = { workspace = true }
toml            = { workspace = true }
thiserror       = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tracing = { workspace = true }
veryl-analyzer  = { workspace = true }
veryl-metadata  = { workspace = true }
veryl-parser    = { workspace = true }
veryl-simulator = { workspace = true }

[dev-dependencies]
celox-design = { workspace = true }
# Fairness tests read settle counts; keep profiling out of benchmark builds.
veryl-simulator = { workspace = true, features = ["profile"] }

[lints]
workspace = true
