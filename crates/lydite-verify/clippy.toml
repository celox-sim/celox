# lydite is a standalone verifier CLI: Celox's simulator-library rules in the
# workspace clippy.toml (no env reads, no eprintln, Fx hash maps) do not apply.

# Explicit state ownership also applies to the verifier crates.
disallowed-macros = [
    { path = "std::thread_local", reason = "production state must be owned and passed explicitly; only test-local instrumentation may opt out" },
]

# The workspace's state-ownership bans: no interior mutability outside
# reasoned sites (LazyLock statics stay allowed).
disallowed-types = [
    { path = "std::cell::RefCell", reason = "state is owned and passed explicitly: take &mut, return results, or key caches by all their inputs instead of mutating shared state behind shared references" },
    { path = "std::cell::Cell", reason = "state is owned and passed explicitly: take &mut, return results, or key caches by all their inputs instead of mutating shared state behind shared references" },
    { path = "std::sync::Mutex", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::RwLock", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::OnceLock", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::cell::OnceCell", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::cell::LazyCell", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::cell::UnsafeCell", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicBool", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicPtr", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicU8", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicU16", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicU32", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicU64", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicUsize", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicI8", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicI16", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicI32", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicI64", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
    { path = "std::sync::atomic::AtomicIsize", reason = "shared or lazily initialized state is owned and passed explicitly; a site that is real cross-thread state or an immutable static table says so with #[expect(clippy::disallowed_types, reason = \"...\")]" },
]
