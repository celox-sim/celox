[package]
name = "celox-test-suite"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
description = "Reusable Veryl and SystemVerilog tests for compiler and simulator implementations"
readme = "README.md"

[features]
default = []
# Emit the Veryl cases to SystemVerilog.
emit = ["dep:veryl-analyzer", "dep:veryl-emitter", "dep:veryl-parser", "dep:veryl-metadata"]
# The external-simulator runners shared by both suites. Port shapes of the
# SystemVerilog cases come from the Celox SystemVerilog analyzer.
external = ["emit", "dep:clap", "dep:serde_json", "dep:celox-sv-analyzer"]
verilator = ["external"]
icarus = ["external"]

[[bin]]
name = "verify-verilator"
path = "src/bin/verify-verilator.rs"
required-features = ["verilator"]

[[bin]]
name = "verify-icarus"
path = "src/bin/verify-icarus.rs"
required-features = ["icarus"]

[[bin]]
name = "verify-sv-verilator"
path = "src/bin/verify-sv-verilator.rs"
required-features = ["verilator"]

[[bin]]
name = "verify-sv-icarus"
path = "src/bin/verify-sv-icarus.rs"
required-features = ["icarus"]

[[example]]
name = "inspect-mismatch-ir"
required-features = ["emit"]

[dependencies]
veryl-analyzer = { workspace = true, optional = true }
veryl-emitter = { workspace = true, optional = true }
veryl-parser = { workspace = true, optional = true }
veryl-metadata = { workspace = true, optional = true }
celox-sv-analyzer = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
num-bigint.workspace = true
num-traits.workspace = true
veryl-std.workspace = true

[lints]
workspace = true
