pre-push:
  piped: true
  commands:
    clean-tree:
      priority: 0
      run: git diff --quiet && git diff --cached --quiet && test -z "$(git ls-files --others --exclude-standard)"
      fail_text: "Push rejected: uncommitted or untracked changes exist. Commit, stash, or .gitignore them first."
    submodule-check:
      priority: 1
      run: bash scripts/check-submodules.sh
    cargo-fmt:
      priority: 2
      run: cargo fmt --all -- --check
    biome:
      priority: 2
      run: pnpm run lint
    # Keep the local gate bounded. Full clippy, tests, NAPI builds, frontend
    # builds, and documentation builds remain required in GitHub Actions.
    cargo-check:
      priority: 3
      run: cargo check --workspace --locked
