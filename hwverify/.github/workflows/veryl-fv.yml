name: Veryl finite conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  veryl-fv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out hwverify
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup override set 1.98.1
          python3 --version
      - name: Extract, lower and verify the pinned Veryl corpus
        run: ./conformance/veryl/run_ci.sh "$RUNNER_TEMP/veryl-conformance"
      - name: Upload complete conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veryl-fv-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veryl-conformance/
          if-no-files-found: error
          retention-days: 14
