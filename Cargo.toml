[workspace]
members = [
    "crates/celox",
    "crates/celox-analysis",
    "crates/celox-backend-cranelift",
    "crates/celox-backend-common",
    "crates/celox-backend-arm64",
    "crates/celox-backend-wasm",
    "crates/celox-backend-x86",
    "crates/celox-bench",
    "crates/celox-design",
    "crates/celox-frontend-core",
    "crates/celox-frontend-sdk",
    "crates/celox-frontend-sv",
    "crates/celox-frontend-veryl",
    "crates/celox-sir",
    "crates/celox-sir-opt",
    "crates/celox-slt",
    "crates/celox-state-layout",
    "crates/celox-sv-analyzer",
    "crates/celox-runtime",
    "crates/celox-testbench",
    "crates/celox-bench-sv",
    "crates/celox-macros",
    "crates/celox-napi",
    "crates/celox-ts-gen",
    "crates/celox-wasm",
    "crates/celox-vpi",
    "examples/my-frontend-napi",
]
resolver = "2"

[workspace.package]
# Keep the publishable Rust crates in lockstep with VERSION and the npm packages.
# Release Please updates this annotated line as part of the shared release PR.
version     = "0.4.1" # x-release-please-version
authors     = ["tignear"]
repository  = "https://github.com/celox-sim/celox"
keywords    = ["hdl", "simulator", "veryl"]
categories  = ["simulation"]
license     = "MIT OR Apache-2.0"
readme      = "README.md"
edition     = "2024"
description = "Celox HDL Simulator"
rust-version = "1.98.0"

[workspace.dependencies]
celox                   = { version = "=0.4.1", path = "crates/celox", default-features = false } # x-release-please-version
celox-analysis          = { version = "=0.4.1", path = "crates/celox-analysis" } # x-release-please-version
celox-backend-arm64     = { version = "=0.4.1", path = "crates/celox-backend-arm64" } # x-release-please-version
celox-backend-common    = { version = "=0.4.1", path = "crates/celox-backend-common" } # x-release-please-version
celox-backend-cranelift = { version = "=0.4.1", path = "crates/celox-backend-cranelift" } # x-release-please-version
celox-backend-wasm      = { version = "=0.4.1", path = "crates/celox-backend-wasm" } # x-release-please-version
celox-backend-x86       = { version = "=0.4.1", path = "crates/celox-backend-x86" } # x-release-please-version
celox-design            = { version = "=0.4.1", path = "crates/celox-design" } # x-release-please-version
celox-frontend-core     = { version = "=0.4.1", path = "crates/celox-frontend-core" } # x-release-please-version
celox-frontend-sdk      = { version = "=0.4.1", path = "crates/celox-frontend-sdk" } # x-release-please-version
celox-frontend-sv       = { version = "=0.4.1", path = "crates/celox-frontend-sv" } # x-release-please-version
celox-frontend-veryl    = { version = "=0.4.1", path = "crates/celox-frontend-veryl" } # x-release-please-version
celox-macros            = { version = "=0.4.1", path = "crates/celox-macros" } # x-release-please-version
celox-napi              = { version = "=0.4.1", path = "crates/celox-napi" } # x-release-please-version
celox-runtime           = { version = "=0.4.1", path = "crates/celox-runtime" } # x-release-please-version
celox-sir               = { version = "=0.4.1", path = "crates/celox-sir" } # x-release-please-version
celox-sir-opt           = { version = "=0.4.1", path = "crates/celox-sir-opt", default-features = false } # x-release-please-version
celox-slt               = { version = "=0.4.1", path = "crates/celox-slt" } # x-release-please-version
celox-state-layout      = { version = "=0.4.1", path = "crates/celox-state-layout" } # x-release-please-version
celox-sv-analyzer       = { version = "=0.4.1", path = "crates/celox-sv-analyzer" } # x-release-please-version
celox-testbench         = { version = "=0.4.1", path = "crates/celox-testbench" } # x-release-please-version
celox-ts-gen            = { version = "=0.4.1", path = "crates/celox-ts-gen" } # x-release-please-version

veryl-analyzer = { git = "https://github.com/veryl-lang/veryl.git", rev = "0783385d7cf4a8e57490c840b16a1e877a339814" }
veryl-emitter = { git = "https://github.com/veryl-lang/veryl.git", rev = "0783385d7cf4a8e57490c840b16a1e877a339814" }
veryl-metadata = { git = "https://github.com/veryl-lang/veryl.git", rev = "0783385d7cf4a8e57490c840b16a1e877a339814" }
veryl-parser = { git = "https://github.com/veryl-lang/veryl.git", rev = "0783385d7cf4a8e57490c840b16a1e877a339814", default-features = false }
veryl-path = { git = "https://github.com/veryl-lang/veryl.git", rev = "0783385d7cf4a8e57490c840b16a1e877a339814" }
veryl-simulator = { git = "https://github.com/veryl-lang/veryl.git", rev = "0783385d7cf4a8e57490c840b16a1e877a339814" }
veryl-std = { git = "https://github.com/veryl-lang/veryl.git", rev = "0783385d7cf4a8e57490c840b16a1e877a339814" }
sv-parser = "0.13.5"

bit-set         = "0.11"
clap            = { version = "4.5.60", features = ["derive"] }
fxhash          = "0.2.1"
itertools       = "0.15.0"
libc            = "0.2"
miette          = { version = "7.6" }
num-bigint      = { version = "0.5", features = ["serde"] }
num-traits      = "0.2.19"
rand            = { version = "0.10", default-features = false }
rand_pcg        = "0.10"
serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
tempfile        = "3.26"
thiserror       = "2.0"
toml            = "1.0.3"
tracing         = "0.1"

[patch.crates-io]
# Disable veryl-metadata's default gitoxide feature to avoid pulling aws-lc-sys
# into napi-cross builds.
veryl-metadata = { path = "vendor/veryl-metadata" }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
type_complexity = "allow"
too_many_arguments = "allow"
collapsible_if = "allow"

[profile.dev.build-override]
opt-level = 3

[profile.dev]
debug = false

[profile.dev.package]
insta.opt-level   = 3
similar.opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
strip         = "debuginfo"
lto           = true
codegen-units = 1

# Fast incremental host build for iterative Heliodor correctness checks.
# The fixed acceptance gate still uses the release/LTO profile.
[profile.heliodor-dev]
inherits      = "release"
lto           = false
codegen-units = 16
incremental   = true

[profile.bench]
debug = true

# Profile for wasm-pack builds. LTO is disabled to avoid a known issue
# where proc-macro dependencies (syn) get incorrectly compiled for the
# wasm32 target under full LTO.
[profile.wasm-release]
inherits      = "release"
lto           = false
codegen-units = 16
