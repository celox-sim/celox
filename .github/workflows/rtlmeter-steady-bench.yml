name: RTLMeter Steady-State Benchmark

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: rtlmeter-steady-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  yield:
    # Scheduled runs start hours after their cron time and then hold runners
    # for hours while pull request CI waits. Skip a scheduled run while CI is
    # backed up; the next night measures master again.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.queue.outputs.run }}
    steps:
      - id: queue
        env:
          EVENT: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = schedule ]; then
            queued=$(gh run list --workflow ci.yml --status queued --limit 100 --json databaseId --jq length)
            if [ "$queued" -gt 2 ]; then
              run=false
              echo "::notice::Skipped: $queued CI runs are waiting for runners."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: yield
    if: needs.yield.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p celox-vpi --bin celox
      - uses: actions/upload-artifact@v7
        with:
          name: rtlmeter-steady-celox
          path: target/release/celox
          if-no-files-found: error

  comparison:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        case: [e902, e906]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: $/.github/actions/setup-verilator
        with:
          version: "5.054"
          revision: bbb60a403932a9f695cb6ff001ceb73de6ad9234
      - uses: cachix/install-nix-action@v31.11.3
      - name: Build the release fixed by flake.lock
        run: |
          mkdir -p work
          nix build --no-update-lock-file .#xezim --out-link work/xezim-release
          echo "$GITHUB_WORKSPACE/work/xezim-release/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: rtlmeter-steady-celox
          path: work/rtlmeter-bin
      - name: Install pinned descriptor reader and test collector
        run: |
          python -m pip install -r benchmarks/rtlmeter/requirements.txt
          python -m unittest discover -s scripts/tests -p test_rtlmeter_bench.py -v
      - name: Record host and tool identities
        run: |
          mkdir -p work/rtlmeter-report
          {
            echo "runner_name=$RUNNER_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            uname -a
            lscpu
            free -h
            verilator --version
            xezim -V
            c++ --version
            python --version
          } > work/rtlmeter-report/host.txt
      - run: python scripts/run-rtlmeter-bench.py prepare work/rtlmeter-source --manifest benchmarks/rtlmeter/steady_manifest.json
      - name: Compare both state models on this VM and CPU
        run: |
          chmod +x work/rtlmeter-bin/celox
          python scripts/run-rtlmeter-bench.py run '${{ matrix.case }}' work/rtlmeter-source work/rtlmeter-bin/celox work/rtlmeter-report/result --manifest benchmarks/rtlmeter/steady_manifest.json
      - name: Retain timings, probes and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtlmeter-steady-${{ matrix.case }}
          path: work/rtlmeter-report
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: comparison
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: rtlmeter-steady-*
          path: artifacts
      - name: Validate every report before publishing
        run: |
          for case in e902 e906; do
            node scripts/publish-rtlmeter-bench.mjs "artifacts/rtlmeter-steady-$case/result/results.json" "artifacts/rtlmeter-steady-$case/host.txt" --validate-only
          done
          for case in e902 e906; do
            node scripts/publish-rtlmeter-bench.mjs "artifacts/rtlmeter-steady-$case/result/results.json" "artifacts/rtlmeter-steady-$case/host.txt"
          done
