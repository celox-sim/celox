name: NAPI Build & Publish

on:
  repository_dispatch:
    types: [napi-release]
  workflow_dispatch:
    inputs:
      channel:
        description: Package channel to publish
        required: true
        default: stable
        type: choice
        options:
          - stable
          - nightly-stable
          - nightly-head
      tag:
        description: Existing v-prefixed release tag (required for stable)
        required: false
        type: string

concurrency:
  group: napi-publish-${{ inputs.channel || github.event.client_payload.tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
  NIGHTLY: ${{ startsWith(inputs.channel, 'nightly-') }}
  NIGHTLY_CHANNEL: ${{ inputs.channel == 'nightly-stable' && 'stable' || inputs.channel == 'nightly-head' && 'head' || '' }}
  BUILD_REF: ${{ startsWith(inputs.channel, 'nightly-') && github.sha || (github.event.client_payload.tag || inputs.tag) }}
  NPM_TAG: ${{ inputs.channel == 'nightly-stable' && 'nightly-stable' || inputs.channel == 'nightly-head' && 'nightly-head' || 'latest' }}

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve immutable build revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check nightly source branch
        if: env.NIGHTLY == 'true'
        shell: bash
        run: |
          case "$NIGHTLY_CHANNEL" in
            stable) expected_ref="refs/heads/master" ;;
            head) expected_ref="refs/heads/develop" ;;
            *) echo "Unknown nightly channel $NIGHTLY_CHANNEL." >&2; exit 1 ;;
          esac
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "$NPM_TAG must be dispatched from $expected_ref, got $GITHUB_REF." >&2
            exit 1
          fi

      - if: env.NIGHTLY == 'true'
        uses: ./.github/actions/set-nightly-version
        with:
          enabled: ${{ env.NIGHTLY }}
          channel: ${{ env.NIGHTLY_CHANNEL }}

      - name: Check nightly Veryl compatibility lane
        if: env.NIGHTLY == 'true'
        run: node scripts/check-veryl-lane.mjs "$NIGHTLY_CHANNEL"

      - name: Check release tag
        if: env.NIGHTLY != 'true'
        shell: bash
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "A stable publication requires a v-prefixed release tag." >&2
            exit 1
          fi
          expected_tag="v$(tr -d '\r\n' < VERSION)"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match VERSION ($expected_tag)." >&2
            exit 1
          fi

      - name: Check published GitHub release
        if: env.NIGHTLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          published_tag="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease \
              --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName'
          )"
          if [ "$published_tag" != "$RELEASE_TAG" ]; then
            echo "Published GitHub Release $RELEASE_TAG was not found." >&2
            exit 1
          fi

      - name: Check synchronized versions and stable dependencies
        if: env.NIGHTLY != 'true'
        run: node scripts/check-release-version.mjs

  build:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            napi-cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            napi-cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.build_sha }}
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - if: env.NIGHTLY == 'true'
        uses: ./.github/actions/set-nightly-version
        with:
          enabled: ${{ env.NIGHTLY }}
          channel: ${{ env.NIGHTLY_CHANNEL }}

      - uses: pnpm/action-setup@v6

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Install ziglang (musl targets)
        if: matrix.zigbuild
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild (musl targets)
        if: matrix.zigbuild
        run: cargo install cargo-zigbuild

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (napi-cross)
        if: matrix.napi-cross
        working-directory: crates/celox-napi
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: npx napi build --platform --release --manifest-path ../../Cargo.toml -p celox-napi --target ${{ matrix.target }} --use-napi-cross

      - name: Build (zigbuild)
        if: matrix.zigbuild
        working-directory: crates/celox-napi
        run: npx napi build --platform --release --manifest-path ../../Cargo.toml -p celox-napi --target ${{ matrix.target }} -x

      - name: Build (native)
        if: ${{ !matrix.napi-cross && !matrix.zigbuild }}
        working-directory: crates/celox-napi
        run: npx napi build --platform --release --manifest-path ../../Cargo.toml -p celox-napi --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            crates/celox-napi/*.node
            crates/celox-napi/index.js
            crates/celox-napi/index.d.ts
          if-no-files-found: error

  test:
    needs: [validate-release, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    name: Test - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.build_sha }}
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - if: env.NIGHTLY == 'true'
        uses: ./.github/actions/set-nightly-version
        with:
          enabled: ${{ env.NIGHTLY }}
          channel: ${{ env.NIGHTLY_CHANNEL }}

      - uses: pnpm/action-setup@v6

      - name: Download binding artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: crates/celox-napi/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter="!@celox-sim/celox-napi" --filter="!@celox-sim/playground" -r build

      - name: Run tests
        run: pnpm --filter="!@celox-sim/celox-napi" --filter="!@celox-sim/playground" -r test

  publish:
    needs: [validate-release, test]
    runs-on: ubuntu-latest
    name: Publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.build_sha }}
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - if: env.NIGHTLY == 'true'
        uses: ./.github/actions/set-nightly-version
        with:
          enabled: ${{ env.NIGHTLY }}
          channel: ${{ env.NIGHTLY_CHANNEL }}

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exclude WASI from npm publish targets
        working-directory: crates/celox-napi
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.napi.targets = pkg.napi.targets.filter((target) => target !== 'wasm32-wasip1-threads'); fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: crates/celox-napi/artifacts

      - name: Create npm dirs
        working-directory: crates/celox-napi
        run: npx napi create-npm-dirs

      - name: Sync version to platform packages
        working-directory: crates/celox-napi
        run: npx napi version

      - name: Move artifacts
        working-directory: crates/celox-napi
        run: npx napi artifacts --build-output-dir artifacts

      - name: Copy index files from build artifacts
        working-directory: crates/celox-napi
        shell: bash
        run: |
          first_dir="$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'bindings-*' -print -quit)"
          if [ -z "$first_dir" ]; then
            echo "No binding artifact directory was downloaded." >&2
            exit 1
          fi
          cp "$first_dir/index.js" .
          cp "$first_dir/index.d.ts" .

      - name: Prepublish
        working-directory: crates/celox-napi
        env:
          GITHUB_REPOSITORY: ""
        run: npx napi prepublish -t npm --skip-optional-publish

      - name: List packages
        working-directory: crates/celox-napi
        run: |
          echo "Publishing version: $(node -p "require('./package.json').version")"
          echo "=== Main package ==="
          ls -la index.js index.d.ts ./*.node
          echo "=== Platform packages ==="
          ls -la ./npm/*/

      - name: Publish platform packages
        working-directory: crates/celox-napi
        shell: bash
        run: |
          for dir in npm/*/; do
            if [ -d "$dir" ]; then
              package_name="$(node -p "require('./$dir/package.json').name")"
              package_version="$(node -p "require('./$dir/package.json').version")"
              if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
                echo "$package_name@$package_version is already published; skipping."
              else
                npm publish "$dir" --provenance --access public --tag "$NPM_TAG"
              fi
            fi
          done

      - name: Publish main package
        working-directory: crates/celox-napi
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published; skipping."
          else
            npm publish --provenance --access public --tag "$NPM_TAG"
          fi

  publish-js:
    needs: [validate-release, publish]
    runs-on: ubuntu-latest
    name: Publish JS Packages
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.build_sha }}
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - if: env.NIGHTLY == 'true'
        uses: ./.github/actions/set-nightly-version
        with:
          enabled: ${{ env.NIGHTLY }}
          channel: ${{ env.NIGHTLY_CHANNEL }}

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter="!@celox-sim/celox-napi" --filter="!@celox-sim/playground" -r build

      - name: Publish @celox-sim/celox
        working-directory: packages/celox
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published; skipping."
          else
            pnpm publish --provenance --access public --no-git-checks --tag "$NPM_TAG"
          fi

      - name: Publish @celox-sim/vite-plugin
        working-directory: packages/vite-plugin
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published; skipping."
          else
            pnpm publish --provenance --access public --no-git-checks --tag "$NPM_TAG"
          fi
