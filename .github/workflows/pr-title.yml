name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:

# Keep only the newest request for each PR, including queue-description edits.
# Still validate every surviving event: skipping edits could mask a failed check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    # Edits can arrive after closure. Do not allocate a runner for those events.
    # Keep all open-PR edits: a skipped required check could mask a prior failure.
    if: >-
      github.event_name == 'merge_group' ||
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted title validator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate pull request title
        if: github.event_name == 'pull_request_target' && !startsWith(github.head_ref, 'mergify/merge-queue/')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs "$PR_TITLE"

      - name: Validate pull request commit release impact
        if: github.event_name == 'pull_request_target' && !startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.base.ref == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr-release-impact.mjs

      # Batch source is data only. Execute validators from the trusted checkout.
      - name: Check out the queue tree for metadata
        if: github.event_name == 'pull_request_target' && startsWith(github.head_ref, 'mergify/merge-queue/')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: queue-tree
          persist-credentials: false

      - name: Install queue metadata reader
        if: github.event_name == 'pull_request_target' && startsWith(github.head_ref, 'mergify/merge-queue/')
        uses: Mergifyio/setup-cli@dc99f07e699b94b39e5495c24596372813eadcbc # v1.3.0
        with:
          mergify_cli_version: 2026.10.5

      - name: Validate queued pull request titles and release impact
        if: github.event_name == 'pull_request_target' && startsWith(github.head_ref, 'mergify/merge-queue/')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-mergify-queue-title.mjs

      - name: Revalidate merge group release impact
        if: github.event_name == 'merge_group' && github.event.merge_group.base_ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        run: node scripts/check-pr-release-impact.mjs
