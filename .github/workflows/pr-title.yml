name: PR Title

on:
  # This workflow intentionally runs from the trusted default branch. Checking
  # out the PR merge commit would let a pull request replace its own validator.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted title validator
        uses: actions/checkout@v7
        with:
          # An older PR's base SHA can predate the validator itself. Always use
          # the current default branch, which pull requests cannot modify.
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate release merge settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-repository-settings.mjs

      - name: Validate pull request title
        if: github.event_name == 'pull_request_target'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs "$PR_TITLE"

      - name: Validate pull request commit release impact
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-release-impact.mjs

      - name: Preserve the required check in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "Pull request titles are validated before entering the merge queue."
