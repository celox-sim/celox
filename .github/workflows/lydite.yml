name: lydite

# Proof, editor, and pinned-Celox conformance gates imported from
# https://github.com/tignear/hwverify. The workspace crates are also built,
# linted by ci.yml; this workflow owns Lydite tests and conformance gates.

on:
  # Select affected lanes on changes; run every lane weekly and on demand.
  pull_request:
  merge_group:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # The workspace release profile uses fat LTO for the simulator. lydite's
  # gates hash the checker they build, so a faster profile changes nothing.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

defaults:
  run:
    working-directory: lydite

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      core: ${{ steps.scope.outputs.core }}
      bridge: ${{ steps.scope.outputs.bridge }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected Lydite lanes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci-lydite-changes.mjs "$BASE_SHA" "$HEAD_SHA"

  rust:
    timeout-minutes: 30
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true' || needs.changes.outputs.bridge == 'true')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install recorded solver version
        run: python -m pip install z3-solver==5.1.0
      - name: Test affected Lydite packages and documentation
        env:
          CORE: ${{ needs.changes.outputs.core }}
          BRIDGE: ${{ needs.changes.outputs.bridge }}
          DETECTION: ${{ needs.changes.result }}
        run: |
          args=()
          if [ "$DETECTION" != success ] || [ "$CORE" = true ]; then
            args+=(-p lydite -p lydite-ir -p lydite-solver -p lydite-syntax -p lydite-verify)
          fi
          if [ "$DETECTION" != success ] || [ "$BRIDGE" = true ]; then
            args+=(-p lydite-celox)
          fi
          Z3_BIN="$(command -v z3)"
          export Z3_BIN
          cargo test --locked "${args[@]}"

  documentation:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check local documentation links and headings
        run: python3 scripts/check_docs.py

  editor:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Build the isolated editor worker
        run: cargo build --release --locked --bin lydite-editor
      - name: Check bounded responses and reject deadlock and dropped-request mutants
        run: |
          cargo test --release --locked -p lydite --test responses --bin lydite-editor
          cargo test --release --locked -p lydite-verify acceptance_cover
      - name: Check LSP lifecycle and fresh proof outcomes over stdio
        run: python3 -m unittest editor.test_server -v
      - name: Install and check the pinned VS Code client
        run: |
          npm ci --prefix editor/vscode --ignore-scripts --no-audit --no-fund
          node --check editor/vscode/extension.js
          npm run test:unit --prefix editor/vscode
          npm run test:rpc --prefix editor/vscode
      - name: Install Extension Host display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0t64 libgbm1 libnss3 libasound2t64 libxshmfence1
      - name: Exercise real VS Code Extension Host with the checked Rust worker
        timeout-minutes: 5
        run: xvfb-run -a npm test --prefix editor/vscode

  # celox-replay and veryl-proof use the in-tree Celox; the narrow veryl gate
  # checks lydite's own Veryl lowering against a pinned upstream corpus.
  celox-replay:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.bridge == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: Reproduce source violations and AXI4-Lite protocol regressions with Celox
        run: ./conformance/axi4lite/run_ci.sh "$RUNNER_TEMP/celox-replay"
      - name: Upload complete replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: celox-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/celox-replay/
          if-no-files-found: error
          retention-days: 14

  veryl-fv:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      # The conformance gates are pinned to Python 3.12.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Extract, lower and verify the pinned Veryl corpus
        run: ./conformance/veryl/run_ci.sh "$RUNNER_TEMP/veryl-conformance"
      - name: Upload complete conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veryl-fv-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veryl-conformance/
          if-no-files-found: error
          retention-days: 14

  veryl-proof-corpus:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.bridge == 'true')
    runs-on: ubuntu-26.04
    # Cold builds plus the sequential proof/mutation gates can exceed one hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      # The conformance gates are pinned to Python 3.12.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run every reusable suite case with proof-backed reads
        run: ./conformance/veryl-proof/run_ci.sh "$RUNNER_TEMP/veryl-proof"
      - name: Verify symbolic Veryl pipeline against ISA and reject RTL mutants
        run: ./conformance/veryl-symbolic/run_ci.sh "$RUNNER_TEMP/veryl-symbolic"
      - name: Verify typed lemma candidates and proof-use diagnostics
        run: python3 -m audit.lemma_candidates.ci --out "$RUNNER_TEMP/lemma-candidates"
      - name: Verify selected RV32I architecture, memory, latency and mutations
        run: ./conformance/veryl-symbolic/run_rv32i_ci.sh "$RUNNER_TEMP/selected-rv32i"
      - name: Verify fixed automatic-proof held-outs and original-formula mutants
        run: ./conformance/veryl-symbolic/run_automatic_ci.sh "$RUNNER_TEMP/automatic-proof"
      - name: Verify checked equality sharing and retain explicit Unknown diagnostics
        run: |
          python3 -m unittest audit.equality_sharing.test_generate audit.equality_sharing.test_evidence audit.equality_sharing.test_ci
          python3 -m audit.equality_sharing.ci --checker ../target/release/lydite --out "$RUNNER_TEMP/equality-sharing"
      - name: Verify whole-word frontier controls and original-formula mutants
        run: |
          python3 -m unittest audit.word_frontier.test_generate audit.word_frontier.test_ci
          python3 -m audit.word_frontier.ci --checker ../target/release/lydite --expected-checker-sha256 "$(sha256sum ../target/release/lydite | cut -d' ' -f1)" --out "$RUNNER_TEMP/word-frontier"
      - name: Verify guarded word expansion and reject escaped guards
        run: |
          cargo test --release --locked -p lydite-solver equality_sharing::tests
          python3 -m unittest audit.guarded_expansion.test_generate audit.guarded_expansion.test_ci
          python3 -m audit.guarded_expansion.ci --checker ../target/release/lydite --expected-checker-sha256 "$(sha256sum ../target/release/lydite | cut -d' ' -f1)" --out "$RUNNER_TEMP/guarded-expansion"
      - name: Upload proof and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veryl-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/veryl-proof/
            ${{ runner.temp }}/veryl-symbolic/
            ${{ runner.temp }}/selected-rv32i/
            ${{ runner.temp }}/automatic-proof/
            ${{ runner.temp }}/equality-sharing/
            ${{ runner.temp }}/word-frontier/
            ${{ runner.temp }}/guarded-expansion/
            ${{ runner.temp }}/lemma-candidates/
          if-no-files-found: error
          retention-days: 14

  result:
    name: Lydite checks
    needs: [changes, rust, documentation, editor, celox-replay, veryl-fv, veryl-proof-corpus]
    if: always()
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every selected lane to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          assert needs["changes"]["result"] == "success", needs
          assert all(needs["changes"]["outputs"].get(key) in ("true", "false") for key in ("core", "bridge")), needs
          for job, lane in {"rust": None, "documentation": "core", "editor": "core", "celox-replay": "bridge", "veryl-fv": "core", "veryl-proof-corpus": "bridge"}.items():
              outputs = needs["changes"]["outputs"]
              selected = outputs.get(lane) == "true" if lane else any(outputs.get(key) == "true" for key in ("core", "bridge"))
              assert needs[job]["result"] == ("success" if selected else "skipped"), (job, needs[job])
          PYCODE
