name: Publish CLI Binaries

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing source tag to publish using a repaired workflow tag
        required: false
        type: string
      release_tag:
        description: Stable release tag to resume from a numbered recovery tag
        required: false
        type: string
  # Build and smoke-test every target when this workflow changes; a pull
  # request uploads nothing.
  pull_request:
    paths:
      - .github/workflows/publish-cli.yml

concurrency:
  group: cli-publish-${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || inputs.source_tag || github.ref_name }}
  SOURCE_TAG: ${{ inputs.source_tag || github.ref_name }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    if: github.event_name == 'workflow_dispatch'
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || github.sha }}
          fetch-depth: 0

      - name: Check release tag and version
        id: source
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Run this workflow from a v-prefixed stable release tag." >&2
            exit 1
          fi
          if [[ "$SOURCE_TAG" != "$RELEASE_TAG" ]]; then
            recovery_prefix="$RELEASE_TAG-recovery."
            recovery_number="${SOURCE_TAG#"$recovery_prefix"}"
            if [[ "$SOURCE_TAG" != "$recovery_prefix"* || ! "$recovery_number" =~ ^[1-9][0-9]*$ ]]; then
              echo "Recovery source tag must match $RELEASE_TAG-recovery.N." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$RELEASE_TAG" "$SOURCE_TAG"; then
              echo "Recovery source tag $SOURCE_TAG must descend from $RELEASE_TAG." >&2
              exit 1
            fi
          fi
          # Bind all consumers to the exact tag checkout, never the repair workflow.
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$SOURCE_TAG^{commit}")"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          expected_tag="v$(tr -d '\r\n' < VERSION)"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match VERSION ($expected_tag)." >&2
            exit 1
          fi

      - name: Check published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          published_tag="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease \
              --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName'
          )"
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo "Published GitHub Release $RELEASE_TAG was not found." >&2
            exit 1
          fi

      - name: Check synchronized release versions
        run: node scripts/check-release-version.mjs

  qualify:
    name: Verify release branch qualification
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Require the successful candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: node scripts/check-release-qualification.mjs

  build:
    name: Build - ${{ matrix.target }}
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || github.event_name == 'pull_request') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-rust

      - name: Build the celox command
        run: cargo build --locked --release -p celox --bin celox --bin veryl-celox

      - name: Smoke-test the command and the Veryl subcommand
        run: |
          bin=target/release
          version="$(tr -d '\r\n' < VERSION)"
          test "$("$bin/celox" --version | tr -d '\r')" = "celox $version"
          "$bin/veryl-celox" --info
          printf 'module Top;\n  initial begin\n    $display("celox smoke test");\n    $finish;\n  end\nendmodule\n' > "$RUNNER_TEMP/smoke.sv"
          "$bin/veryl-celox" run "$RUNNER_TEMP/smoke.sv" --top Top | tee "$RUNNER_TEMP/smoke.out"
          grep -q 'celox smoke test' "$RUNNER_TEMP/smoke.out"

      # cargo-binstall finds these through `package.metadata.binstall` of
      # crates/celox/Cargo.toml; keep the names in sync.
      - name: Package the binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="celox-$TARGET"
          extension=""
          [[ "$TARGET" == *-windows-* ]] && extension=".exe"
          mkdir -p "dist/$name"
          cp "target/release/celox$extension" "target/release/veryl-celox$extension" \
            LICENSE-APACHE LICENSE-MIT README.md "dist/$name/"
          if [[ "$TARGET" == *-windows-* ]]; then
            (cd dist && 7z a -tzip "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/celox-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Attach to the GitHub Release
    needs: [validate, build, qualify]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      # --clobber lets a retry replace the assets of a partial upload.
      - name: Upload the archives and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum celox-* > celox-sha256sums.txt
          gh release upload "$RELEASE_TAG" celox-* --repo "$GITHUB_REPOSITORY" --clobber
