name: Queue Nightly Packages

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  # heliodor-bench.yml schedules the stable master lane directly. Dispatch the
  # develop ref here as well so the same nightly coverage exercises Veryl HEAD.
  queue-heliodor-develop:
    name: Queue develop Heliodor benchmarks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the Veryl HEAD compatibility lane
        shell: bash
        run: gh workflow run heliodor-bench.yml --repo "$GITHUB_REPOSITORY" --ref develop

  queue:
    name: Queue ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: nightly-stable
            ref: master
          - channel: nightly-head
            ref: develop
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the package build from its source branch
        shell: bash
        run: |
          gh workflow run ci-napi.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ matrix.ref }}" \
            -f "channel=${{ matrix.channel }}"
