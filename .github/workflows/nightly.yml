name: Queue Nightly Packages

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  # ci.yml schedules the default branch itself. Exercise develop's Veryl HEAD
  # lane daily as well; manual CI dispatch always enables full validation.
  queue-ci-develop:
    name: Queue develop full validation
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch full CI on develop
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref develop

  # Lydite core validation also runs on develop; bridge gates are disabled.
  queue-lydite-develop:
    name: Queue develop Lydite validation
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch Lydite core validation on develop
        run: gh workflow run lydite-checks.yml --repo "$GITHUB_REPOSITORY" --ref develop

  queue:
    name: Queue ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: nightly-stable
            ref: master
          - channel: nightly-head
            ref: develop
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the package build from its source branch
        shell: bash
        run: |
          gh workflow run ci-napi.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ matrix.ref }}" \
            -f "channel=${{ matrix.channel }}"
