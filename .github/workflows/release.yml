name: Release Management

on:
  push:
    branches: [master]
  schedule:
    # Monday 12:00 JST / 03:00 UTC. No releasable changes means a no-op.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: release-management
  cancel-in-progress: false

permissions: {}

jobs:
  release-issue:
    name: Update release issue
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # GitHub's generate-notes endpoint requires contents:write, even though
      # planning does not save a release, tag, branch or commit.
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Install release planner
        run: npm ci --ignore-scripts --prefix scripts/release-please
      - name: Update release tracker without opening a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-issue.mjs

  release-please:
    name: Prepare weekly release pull request
    outputs:
      held: ${{ steps.release-issue.outputs.held }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Resources created with GITHUB_TOKEN do not start follow-up workflows.
      # Use an installation token so release PR checks and release-triggered
      # publisher workflows run normally. Workflows permission also allows a
      # failed release to be retried after master advances across workflow edits.
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check whether the release issue is held
        id: release-issue
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          held="$(node scripts/release-issue.mjs held)"
          echo "held=$held" >> "$GITHUB_OUTPUT"

      # Freeze the source PR as soon as queueing is requested, including while
      # waiting for admission or after a dequeue. Rewriting it invalidates the
      # queue's speculative trees, including those of PRs stacked behind it.
      - name: Check whether the release pull request is frozen
        id: release-pr
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        shell: bash
        run: |
          pull_requests="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open --base master \
            --head release-please--branches--master--components--celox \
            --json isCrossRepository,labels)"
          frozen="$(jq -r 'any(.[]; .isCrossRepository == false and any(.labels[]; .name == "merge-ready" or .name == "queued"))' <<< "$pull_requests")"
          echo "frozen=$frozen" >> "$GITHUB_OUTPUT"

      - name: Create release or update release pull request
        id: release
        if: steps.release-issue.outputs.held != 'true'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Version PRs land on master; only the release branch publishes.
          skip-github-release: true
          skip-github-pull-request: ${{ steps.release-pr.outputs.frozen == 'true' }}

      - name: Close tracker after preparing the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: node scripts/release-issue.mjs

  queue-release:
    name: Queue weekly release
    needs: release-please
    if: needs.release-please.outputs.held != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Use the release App to request Mergify queueing through a label.
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Queue the release pull request
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: node scripts/queue-release-pr.mjs
