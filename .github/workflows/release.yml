name: Release Management

on:
  push:
    branches: [master]
  schedule:
    # Monday 12:00 JST / 03:00 UTC. No releasable changes means a no-op.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: release-management
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Update release pull request
    runs-on: ubuntu-latest
    steps:
      # A token other than GITHUB_TOKEN is required so that checks run on the
      # generated pull request and the manifest push starts the publisher.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  queue-release:
    name: Queue weekly release
    needs: release-please
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Enable auto-merge for the release pull request
        shell: bash
        run: |
          release_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label "autorelease: pending" \
              --json number,labels \
              --jq '[.[] | select((.labels | map(.name) | index("release:hold")) | not)][0].number // empty'
          )"

          if [ -z "$release_pr" ]; then
            echo "No unheld release pull request is ready to queue."
            exit 0
          fi

          gh pr merge "$release_pr" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge
