name: Release Management

on:
  push:
    branches: [master]
  schedule:
    # Monday 12:00 JST / 03:00 UTC. No releasable changes means a no-op.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: release-management
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Update release pull request
    runs-on: ubuntu-latest
    steps:
      # Resources created with GITHUB_TOKEN do not start follow-up workflows.
      # Use an installation token so release PR checks and release-triggered
      # publisher workflows run normally. Workflows permission also allows a
      # failed release to be retried after master advances across workflow edits.
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create release or update release pull request
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the processed commit
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
          token: ${{ steps.release-token.outputs.token }}

      - name: Queue package publication for this release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        shell: bash
        run: |
          release_tag="v$(tr -d '\r\n' < VERSION)"
          tag_sha="$(git rev-list -n 1 "$release_tag" 2>/dev/null || true)"

          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "No release tag points at this workflow commit; publication is not needed."
            exit 0
          fi

          published_tag="$(
            gh release view "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease \
              --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName'
          )"
          if [ "$published_tag" != "$release_tag" ]; then
            echo "Published GitHub Release $release_tag was not found." >&2
            exit 1
          fi

          jq -n \
            --arg tag "$release_tag" \
            '{event_type: "napi-release", client_payload: {tag: $tag}}' \
            | gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/dispatches" \
                --input -

  queue-release:
    name: Queue weekly release
    needs: release-please
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Enqueuing an existing PR does not need to trigger another workflow, so
      # the job-scoped token is sufficient and avoids minting a second app token.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enable auto-merge for the release pull request
        shell: bash
        run: |
          release_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base master \
              --limit 1000 \
              --json number,headRefName,isCrossRepository,labels \
              --jq '[.[] | select(.isCrossRepository == false) | select(.headRefName == "release-please--branches--master--components--celox") | select((.labels | map(.name) | index("release:hold")) | not)][0].number // empty'
          )"

          if [ -z "$release_pr" ]; then
            echo "No unheld release pull request is ready to queue."
            exit 0
          fi

          gh pr merge "$release_pr" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge
