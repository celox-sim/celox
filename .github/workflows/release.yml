name: Release Management

on:
  push:
    branches: [master]
  schedule:
    # Monday 12:00 JST / 03:00 UTC. No releasable changes means a no-op.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: release-management
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Update release pull request
    runs-on: ubuntu-latest
    steps:
      # Resources created with GITHUB_TOKEN do not start follow-up workflows.
      # Use an installation token so release PR checks and release-triggered
      # publisher workflows run normally. Workflows permission also allows a
      # failed release to be retried after master advances across workflow edits.
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create release or update release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A merge queue can push several merged PRs together. The release tag
      # then points at an earlier commit than github.sha. Publish the tag that
      # release-please actually created, including on scheduled/manual runs.
      - name: Queue package publication for this release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          release_tag="$RELEASE_TAG"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a v-prefixed stable release tag, got $release_tag." >&2
            exit 1
          fi

          published_tag="$(
            gh release view "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease \
              --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName'
          )"
          if [ "$published_tag" != "$release_tag" ]; then
            echo "Published GitHub Release $release_tag was not found." >&2
            exit 1
          fi

          jq -n \
            --arg tag "$release_tag" \
            '{event_type: "napi-release", client_payload: {tag: $tag}}' \
            | gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/dispatches" \
                --input -

          gh workflow run publish-crates.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$release_tag"

  queue-release:
    name: Queue weekly release
    needs: release-please
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # An enqueue event created with GITHUB_TOKEN would not start the required
      # merge_group workflows. Use the release App so queue checks run normally.
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Queue the release pull request
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: node scripts/queue-release-pr.mjs
