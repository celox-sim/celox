name: CI

on:
  push:
    branches: [master, integration/veryl-head]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'celox-release-please[bot]' && github.head_ref == 'release-please--branches--master--components--celox' }}
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      javascript: ${{ steps.classify.outputs.javascript }}
      napi: ${{ steps.classify.outputs.napi }}
      napi_arm64: ${{ steps.classify.outputs.napi_arm64 }}
      rust: ${{ steps.classify.outputs.rust }}
      scripts: ${{ steps.classify.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/ci-changes.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Validate release version
        if: env.RELEASE_PLEASE_PR == 'true'
        run: node scripts/check-release-version.mjs

  docs:
    name: Docs Build
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

  lint:
    name: Lint & Format
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.javascript == 'true' || needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'

      - name: cargo fmt
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: Verify vendored Veryl metadata
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'
        run: node scripts/veryl-vendor.mjs check

      - name: cargo clippy
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked -p celox -p celox-macros -p celox-napi -p celox-ts-gen --all-targets --no-deps

      - uses: pnpm/action-setup@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true'

      - uses: actions/setup-node@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true'
        run: pnpm install --frozen-lockfile

      - name: Biome check
        if: needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true'
        run: pnpm run lint

      - name: Test repository scripts
        if: needs.changes.result != 'success' || needs.changes.outputs.scripts == 'true'
        run: node --test scripts/*.test.mjs

  rust:
    name: Rust Test & NAPI Build
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.napi == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-wasip1-threads

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'
        run: cargo test --locked

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check NAPI peer compatibility
        run: pnpm peers check

      - name: Build NAPI (debug)
        run: pnpm run build:napi

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-linux-x64-gnu
          path: |
            crates/celox-napi/celox.linux-x64-gnu.node
            crates/celox-napi/index.js
            crates/celox-napi/index.d.ts

      - name: Install WASI SDK
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | tar xz -C /opt
          echo "WASI_SDK_PATH=/opt/wasi-sdk-25.0-x86_64-linux" >> "$GITHUB_ENV"
          echo "CC_wasm32_wasip1_threads=/opt/wasi-sdk-25.0-x86_64-linux/bin/clang" >> "$GITHUB_ENV"

      - name: Build NAPI WASM compatibility target
        run: pnpm --filter @celox-sim/celox-napi exec napi build --platform --target wasm32-wasip1-threads --manifest-path ../../Cargo.toml -p celox-napi

  napi-windows:
    name: NAPI Build (Windows)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.napi == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NAPI (debug)
        run: pnpm run build:napi

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-win32-x64-msvc
          path: |
            crates/celox-napi/celox.win32-x64-msvc.node
            crates/celox-napi/index.js
            crates/celox-napi/index.d.ts

  napi-linux-arm64:
    name: NAPI Build (Linux ARM64 GNU)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.napi_arm64 == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NAPI (Linux ARM64 GNU)
        working-directory: crates/celox-napi
        env:
          CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
        run: npx napi build --platform --manifest-path ../../Cargo.toml -p celox-napi --target aarch64-unknown-linux-gnu --use-napi-cross

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-linux-arm64-gnu
          path: |
            crates/celox-napi/celox.linux-arm64-gnu.node
            crates/celox-napi/index.js
            crates/celox-napi/index.d.ts

  js-ubuntu:
    name: JS Test (Ubuntu)
    needs: [changes, rust]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Download NAPI artifact
        uses: actions/download-artifact@v8
        with:
          name: napi-linux-x64-gnu
          path: crates/celox-napi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Prepare template for local package validation
        working-directory: examples/template
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.devDependencies['@celox-sim/celox']='link:../../packages/celox'; pkg.devDependencies['@celox-sim/vite-plugin']='link:../../packages/vite-plugin'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          printf 'packages:\n  - "."\nallowBuilds:\n  esbuild: true\n' > pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile

      - name: Run template tests
        working-directory: examples/template
        run: pnpm test

      - name: Run tests
        run: pnpm --filter="!@celox-sim/celox-napi" --filter="!@celox-sim/playground" -r test

  js-windows:
    name: JS Test (Windows)
    needs: [changes, napi-windows]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Download NAPI artifact
        uses: actions/download-artifact@v8
        with:
          name: napi-win32-x64-msvc
          path: crates/celox-napi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm --filter="!@celox-sim/celox-napi" --filter="!@celox-sim/playground" -r test
