name: CI

# No push trigger: the merge queue already validated the exact tree that lands
# on master or develop. The daily full runs keep those branches' caches warm.
on:
  pull_request:
  merge_group:
  # Full validation also runs without a change filter, including quiet periods.
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency:
  # A new push must not cancel the daily full run halfway through its corpus.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'changes' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    env:
      STABLE_LANE: ${{ github.ref_name == 'master' || github.base_ref == 'master' || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/master') }}
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      release: ${{ steps.classify.outputs.release }}
      javascript: ${{ steps.classify.outputs.javascript }}
      napi: ${{ steps.classify.outputs.napi }}
      napi_arm64: ${{ steps.classify.outputs.napi_arm64 }}
      rust: ${{ steps.classify.outputs.rust }}
      rust_full: ${{ steps.classify.outputs.rust_full }}
      rust_packages: ${{ steps.classify.outputs.rust_packages }}
      rust_features: ${{ steps.classify.outputs.rust_features }}
      rust_filter: ${{ steps.classify.outputs.rust_filter }}
      rust_libraries: ${{ steps.classify.outputs.rust_libraries }}
      rust_library_features: ${{ steps.classify.outputs.rust_library_features }}
      scripts: ${{ steps.classify.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          FULL_VALIDATION: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          RELEASE_PLEASE_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--master--components--celox' && github.event.pull_request.head.repo.full_name == github.repository }}
          # Scoping pull request tests reads the workspace graph with
          # `cargo metadata --no-deps`, which the runner's stable Cargo can
          # do without installing the pinned toolchain.
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci-changes.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Reject development dependencies from the stable lane
        if: env.STABLE_LANE == 'true'
        run: node scripts/check-release-version.mjs

  docs:
    name: Docs Build
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build docs
        run: pnpm docs:build

  lint:
    name: Lint & Format
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.javascript == 'true' || needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-latest
    env:
      VERYL_LANE: ${{ (github.ref_name == 'develop' || github.base_ref == 'develop' || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/develop')) && 'detect' || 'stable' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'

      - name: Check locked Nix development environment
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'
        run: |
          nix flake check --no-build --all-systems --no-update-lock-file
          nix build --no-link --no-update-lock-file .#checks.x86_64-linux.rust-toolchain

      - uses: ./.github/actions/setup-rust
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'

      - name: Check public crate compile-time includes
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
        run: node scripts/check-package-includes.mjs

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'

      - name: cargo fmt
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: Verify Veryl dependency lane
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          if [ "$VERYL_LANE" = detect ]; then
            detected_lane="$(node scripts/check-veryl-lane.mjs detect)"
            echo "Detected Veryl $detected_lane lane on develop."
          else
            node scripts/check-veryl-lane.mjs "$VERYL_LANE"
            detected_lane="$VERYL_LANE"
          fi
          if [ "$detected_lane" = stable ]; then
            node scripts/veryl-vendor.mjs check
          fi

      - name: cargo clippy
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked -p celox-test-suite -p celox -p celox-frontend-core -p celox-frontend-sv -p celox-frontend-veryl -p celox-macros -p celox-napi -p celox-sv-analyzer -p celox-ts-gen -p celox-vpi -p lydite-ir -p lydite -p lydite-celox -p lydite-solver -p lydite-syntax -p lydite-verify --all-targets --features celox/systemverilog,celox-test-suite/verilator,celox-test-suite/icarus --no-deps

      - name: Build Rust API documentation
        if: needs.changes.result != 'success' || needs.changes.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - uses: pnpm/action-setup@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true'

      - uses: actions/setup-node@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Biome check
        if: needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true'
        run: pnpm run lint

      - name: Test repository scripts
        if: needs.changes.result != 'success' || needs.changes.outputs.scripts == 'true'
        run: node --test scripts/*.test.mjs

      # A new dependency edge can invalidate the NAPI exclusions or the
      # backend and frontend variants that pull requests narrow celox to.
      - name: Check CI runtime dependency exclusions and test scopes
        if: needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.scripts != 'true'
        run: node --test scripts/ci-changes.test.mjs scripts/ci-rust-scope.test.mjs

  rust-tests:
    name: Rust Tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install cocotb
        run: python -m pip install cocotb==2.1.0

      # Z3 5.1.0 is lydite's recorded compatibility-test version.
      - name: Install Z3 for lydite solver tests
        run: python -m pip install z3-solver==5.1.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.144

      # Enable the frontend and suite features together so common integration
      # tests run once, rather than once per Cargo feature combination.
      # nextest schedules tests from all binaries on one pool; `cargo test`
      # runs the binaries one after another.
      # A pull request builds and runs only the tests its changes can affect
      # (scripts/ci-rust-scope.mjs); merge groups and the daily run keep the
      # whole workspace, so the tree that lands is still fully tested.
      - name: Run workspace tests with CI features
        if: needs.changes.outputs.rust_full != 'false'
        run: >-
          Z3_BIN="$(command -v z3)"
          cargo nextest run --locked --workspace --profile ci
          --features celox/systemverilog,celox-test-suite/verilator,celox-test-suite/icarus

      - name: Run the tests this pull request can affect
        if: needs.changes.outputs.rust_full == 'false' && needs.changes.outputs.rust_packages != ''
        env:
          PACKAGES: ${{ needs.changes.outputs.rust_packages }}
          FEATURES: ${{ needs.changes.outputs.rust_features }}
          FILTER: ${{ needs.changes.outputs.rust_filter }}
        run: |
          echo "Packages: $PACKAGES"
          echo "Filter: $FILTER"
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          if [ -n "$FEATURES" ]; then args+=(--features "$FEATURES"); fi
          Z3_BIN="$(command -v z3)" cargo nextest run --locked --profile ci \
            --no-tests=pass "${args[@]}" -E "$FILTER"

      # nextest does not run documentation tests.
      - name: Run workspace documentation tests with CI features
        if: needs.changes.outputs.rust_full != 'false'
        run: >-
          cargo test --locked --workspace --doc
          --features celox/systemverilog,celox-test-suite/verilator,celox-test-suite/icarus

      - name: Run the documentation tests of the changed libraries
        if: needs.changes.outputs.rust_full == 'false' && needs.changes.outputs.rust_libraries != ''
        env:
          LIBRARIES: ${{ needs.changes.outputs.rust_libraries }}
          FEATURES: ${{ needs.changes.outputs.rust_library_features }}
        run: |
          args=()
          for package in $LIBRARIES; do args+=(-p "$package"); done
          if [ -n "$FEATURES" ]; then args+=(--features "$FEATURES"); fi
          cargo test --locked --doc "${args[@]}"

      - name: Verify default-feature library and documentation tests
        if: needs.changes.outputs.rust_full != 'false' || contains(format(' {0} ', needs.changes.outputs.rust_libraries), ' celox ')
        run: |
          cargo test --locked -p celox --lib
          cargo test --locked -p celox --doc

      - name: Run cocotb VPI end-to-end test
        if: needs.changes.outputs.rust_full != 'false' || contains(format(' {0} ', needs.changes.outputs.rust_packages), ' celox-vpi ')
        run: |
          CELOX_COCOTB_PYTHON="$(command -v python)" \
            cargo test --locked -p celox-vpi --test cocotb_e2e \
            cocotb_drives_an_attached_native_flip_flop -- --exact --ignored

  external-suites:
    name: External suite (${{ matrix.suite }}, ${{ matrix.tool }})
    needs: changes
    # Scheduled and manual runs compare even when change detection fails. A
    # merge group that cuts a release also compares before it can merge.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [veryl, sv]
        tool: [verilator, icarus]
    env:
      VERIFY_TOOL: ${{ matrix.tool }}
      VERIFY_SUITE: ${{ matrix.suite }}
      VERIFY_BIN: ${{ matrix.suite == 'sv' && format('verify-sv-{0}', matrix.tool) || format('verify-{0}', matrix.tool) }}
      VERIFY_BASELINE: ${{ matrix.suite == 'sv' && format('crates/celox-test-suite/verification/sv/{0}.json', matrix.tool) || format('crates/celox-test-suite/verification/{0}.json', matrix.tool) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Use the same locked tool versions as the retained exclusion evidence.
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Test live simulator adapters
        if: matrix.suite == 'veryl'
        run: >-
          nix develop --no-update-lock-file --command
          cargo test --locked -p celox-test-suite --features "$VERIFY_TOOL"
          --test oracles -- --ignored

      - name: Catalogue every shared case
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/external-suite"
          nix develop --no-update-lock-file --command \
            cargo run --locked -p celox-test-suite --features "$VERIFY_TOOL" \
            --bin "$VERIFY_BIN" -- --list > "$RUNNER_TEMP/external-suite/catalogue.json"

      - name: Verify every shared case against the external simulator
        id: verify
        if: ${{ !cancelled() }}
        run: |
          # The runner returns 1 for retained failures as well as regressions.
          # The next step checks the complete fresh report and the exit status.
          rm -f "$RUNNER_TEMP/external-suite/report.json"
          if nix develop --no-update-lock-file --command \
            cargo run --locked -p celox-test-suite --features "$VERIFY_TOOL" \
            --bin "$VERIFY_BIN" -- --jobs 2 \
            --output "$RUNNER_TEMP/external-suite/logs" \
            --report "$RUNNER_TEMP/external-suite/report.json"; then
            task_verify_status=0
          else
            task_verify_status=$?
          fi
          echo "exit_status=$task_verify_status" >> "$GITHUB_OUTPUT"

      - name: Reject new or changed external verification failures
        if: ${{ !cancelled() }}
        env:
          VERIFY_EXIT_STATUS: ${{ steps.verify.outputs.exit_status }}
        run: >-
          nix develop --no-update-lock-file --command
          node scripts/check-external-suite-report.mjs
          "$RUNNER_TEMP/external-suite/report.json" "$VERIFY_BASELINE"
          "$RUNNER_TEMP/external-suite/catalogue.json" "$VERIFY_EXIT_STATUS" "$VERIFY_SUITE"

      - name: Retain results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-suite-${{ matrix.suite }}-${{ matrix.tool }}
          # Keep evidence rather than hundreds of generated simulator binaries.
          path: |
            ${{ runner.temp }}/external-suite/catalogue.json
            ${{ runner.temp }}/external-suite/report.json
            ${{ runner.temp }}/external-suite/logs/**/*.json
            ${{ runner.temp }}/external-suite/logs/**/*.log
            ${{ runner.temp }}/external-suite/logs/**/*.veryl
            ${{ runner.temp }}/external-suite/logs/**/*.sv
            ${{ runner.temp }}/external-suite/logs/**/*.v
            ${{ runner.temp }}/external-suite/logs/**/*.svh
            ${{ runner.temp }}/external-suite/logs/**/*.vh
            ${{ runner.temp }}/external-suite/logs/**/harness.cpp
            ${{ runner.temp }}/external-suite/logs/**/vpi_bits.hpp
          if-no-files-found: error
          retention-days: 14

  sv-tests:
    name: sv-tests conformance
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2

      - name: Fetch the pinned sv-tests revision
        run: |
          revision="$(cat conformance/sv-tests/revision)"
          git init -q "$RUNNER_TEMP/sv-tests"
          git -C "$RUNNER_TEMP/sv-tests" fetch -q --depth 1 \
            https://github.com/chipsalliance/sv-tests.git "$revision"
          git -C "$RUNNER_TEMP/sv-tests" checkout -q FETCH_HEAD

      # Any change from the retained results fails, improvements included, so
      # that the expectations follow the frontend.
      - name: Compare elaboration and simulation results with the retained expectations
        run: >-
          cargo run --locked --release -p celox --features systemverilog
          --example sv_tests -- "$RUNNER_TEMP/sv-tests/tests"
          --expected conformance/sv-tests/expected.tsv
          --report "$RUNNER_TEMP/sv-tests-report.tsv"

      - name: Retain the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sv-tests-report
          path: ${{ runner.temp }}/sv-tests-report.tsv
          if-no-files-found: ignore
          retention-days: 14

  napi-linux:
    name: NAPI Build (Linux x64)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.napi == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-napi-linux

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check NAPI peer compatibility
        run: pnpm peers check

      - name: Build NAPI (debug)
        run: pnpm run build:napi

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-linux-x64-gnu
          path: |
            crates/celox-napi/celox.linux-x64-gnu.node
            crates/celox-napi/index.js
            crates/celox-napi/index.d.ts
          if-no-files-found: error

  napi-wasm:
    name: NAPI WASM Build & Test
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.napi == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-wasip1-threads

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-napi-wasm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install WASI SDK
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | tar xz -C /opt
          echo "WASI_SDK_PATH=/opt/wasi-sdk-25.0-x86_64-linux" >> "$GITHUB_ENV"
          echo "CC_wasm32_wasip1_threads=/opt/wasi-sdk-25.0-x86_64-linux/bin/clang" >> "$GITHUB_ENV"

      - name: Build NAPI WASM compatibility target
        run: pnpm --filter @celox-sim/celox-napi exec napi build --platform --target wasm32-wasip1-threads --manifest-path ../../Cargo.toml -p celox-napi

      - name: Build TypeScript runtime for WASM tests
        run: pnpm --filter @celox-sim/celox build

      - name: Run WASM tests
        run: pnpm --filter @celox-sim/playground test:wasm

      - name: Upload NAPI WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-wasm32-wasi
          path: |
            crates/celox-napi/celox.wasi-browser.js
            crates/celox-napi/celox.wasm32-wasi.wasm
            crates/celox-napi/wasi-worker-browser.mjs
          if-no-files-found: error

  # Preserve the existing required check while allowing artifact consumers to
  # start as soon as their build finishes. Failures/cancellations must not turn
  # into a successful check merely because a downstream job was skipped.
  rust:
    name: Rust Test & NAPI Build
    needs: [changes, rust-tests, sv-tests, napi-linux, napi-wasm, external-suites]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.napi == 'true')
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
      RUST_RESULT: ${{ needs.rust-tests.result }}
      SV_TESTS_RESULT: ${{ needs.sv-tests.result }}
      NAPI_REQUIRED: ${{ needs.changes.outputs.napi }}
      NATIVE_RESULT: ${{ needs.napi-linux.result }}
      WASM_RESULT: ${{ needs.napi-wasm.result }}
      # Only a release merge group gates on the comparisons. Full runs report
      # them through report-full-validation instead.
      RELEASE_REQUIRED: ${{ needs.changes.outputs.release }}
      EXTERNAL_RESULT: ${{ needs.external-suites.result }}
    steps:
      - name: Check tests and builds
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RUST_REQUIRED" != false ] || [ "$RUST_RESULT" != skipped ]; then
            test "$RUST_RESULT" = success
          fi
          if [ "$RUST_REQUIRED" != false ] || [ "$SV_TESTS_RESULT" != skipped ]; then
            test "$SV_TESTS_RESULT" = success
          fi
          if [ "$NAPI_REQUIRED" != false ] || [ "$NATIVE_RESULT" != skipped ]; then
            test "$NATIVE_RESULT" = success
          fi
          if [ "$NAPI_REQUIRED" != false ] || [ "$WASM_RESULT" != skipped ]; then
            test "$WASM_RESULT" = success
          fi
          if [ "$RELEASE_REQUIRED" != false ]; then
            test "$EXTERNAL_RESULT" = success
          fi

  arm64-backend:
    name: ARM64 Backend Test
    needs: changes
    # Platform jobs run in merge groups and full runs, not on pull requests.
    # They almost never fail alone; dispatch ci.yml on a branch to run them.
    if: always() && github.event_name != 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2

      - name: Lint ARM64 backend
        run: >-
          cargo clippy --locked
          -p celox-backend-common -p celox-backend-arm64
          --all-targets --no-deps --
          -D warnings
          -A clippy::useless_conversion
          -A clippy::missing_transmute_annotations

      - name: Run ARM64 backend tests natively
        run: cargo test --locked -p celox-backend-common -p celox-backend-arm64

      - name: Check default AArch64 facade and benchmark runner
        run: cargo check --locked -p celox -p celox-bench

      - name: Test AArch64 facade integration
        run: cargo test --locked -p celox --lib --test native_exec

      - name: Check x86-64 cross-codegen from AArch64
        run: >-
          cargo check --locked -p celox -p celox-bench
          --no-default-features --features x86_64-codegen

  napi-windows:
    name: NAPI Build (Windows)
    needs: changes
    if: always() && github.event_name != 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.napi == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build NAPI (debug)
        run: pnpm run build:napi

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-win32-x64-msvc
          path: |
            crates/celox-napi/celox.win32-x64-msvc.node
            crates/celox-napi/index.js
            crates/celox-napi/index.d.ts

  napi-linux-arm64:
    name: NAPI Build (Linux ARM64 GNU)
    needs: changes
    if: always() && github.event_name != 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.napi_arm64 == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build NAPI (Linux ARM64 GNU)
        working-directory: crates/celox-napi
        env:
          CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
        run: npx napi build --platform --manifest-path ../../Cargo.toml -p celox-napi --target aarch64-unknown-linux-gnu --use-napi-cross

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-linux-arm64-gnu
          path: |
            crates/celox-napi/celox.linux-arm64-gnu.node
            crates/celox-napi/index.js
            crates/celox-napi/index.d.ts

  js-ubuntu:
    name: JS Test (Ubuntu)
    needs: [changes, napi-linux]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Download NAPI artifact
        uses: actions/download-artifact@v8
        with:
          name: napi-linux-x64-gnu
          path: crates/celox-napi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build

      - name: Type-check tests and playground
        run: pnpm run typecheck

      - name: Prepare template for local package validation
        working-directory: examples/template
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.devDependencies['@celox-sim/celox']='link:../../packages/celox'; pkg.devDependencies['@celox-sim/vite-plugin']='link:../../packages/vite-plugin'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          printf 'packages:\n  - "."\nallowBuilds:\n  esbuild: true\n' > pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Run template tests
        working-directory: examples/template
        run: pnpm test

      - name: Run tests
        run: pnpm --filter="!@celox-sim/celox-napi" --filter="!@celox-sim/playground" -r test

  js-windows:
    name: JS Test (Windows)
    needs: [changes, napi-windows]
    if: always() && github.event_name != 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Download NAPI artifact
        uses: actions/download-artifact@v8
        with:
          name: napi-win32-x64-msvc
          path: crates/celox-napi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm --filter="!@celox-sim/celox-napi" --filter="!@celox-sim/playground" -r test

  playground-browser:
    name: Playground Browser Test
    needs: [changes, napi-wasm]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.javascript == 'true' || needs.changes.outputs.napi == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Download NAPI WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: napi-wasm32-wasi
          path: crates/celox-napi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build

      - name: Install Chromium
        run: pnpm --filter @celox-sim/playground exec playwright install --with-deps chromium

      # Bound both phases: a hung build or browser process can otherwise hold
      # a runner for the default six hours, even with per-test timeouts.
      - name: Build Playground
        timeout-minutes: 5
        run: pnpm --filter @celox-sim/playground build

      - name: Run Playground browser tests
        timeout-minutes: 5
        run: pnpm --filter @celox-sim/playground exec playwright test

  # Full runs are not merge gates, so a failure must reach someone. Keep one
  # issue per branch open while full CI fails and close it once it passes.
  report-full-validation:
    name: Report full validation
    needs:
      [
        changes,
        docs,
        lint,
        rust-tests,
        sv-tests,
        external-suites,
        napi-linux,
        napi-wasm,
        rust,
        arm64-backend,
        napi-windows,
        napi-linux-arm64,
        js-ubuntu,
        js-windows,
        playground-browser,
      ]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'master' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Open, update, or close the full CI issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-full-ci.mjs
