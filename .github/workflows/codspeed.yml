name: Compile-time Benchmarks

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"

permissions: {}

jobs:
  codspeed:
    name: CodSpeed
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.benchmarks.outputs.run-id }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codspeed-compilation

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed@5.0.1

      - name: Build compile-time benchmarks
        run: cargo codspeed build --locked -p celox --bench compilation

      - name: Run compile-time benchmarks
        id: benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -p celox

  report:
    name: Report CodSpeed
    needs: codspeed
    if: always() && (github.ref_name == 'master' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Report execution failures and performance regressions
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_RESULT: ${{ needs.codspeed.result }}
          CODSPEED_RUN_ID: ${{ needs.codspeed.outputs.run-id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-codspeed.mjs
