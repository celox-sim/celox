name: Heliodor Benchmark

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/actions/setup-rust/**"
      - ".github/workflows/heliodor-bench.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "!crates/celox-napi/package.json"
      - "scripts/convert-heliodor-bench.mjs"
      - "scripts/heliodor-suite.mjs"
      - "scripts/heliodor-suite.test.mjs"
      - "scripts/ci-changes.mjs"
      - "scripts/ci-changes.test.mjs"
      - "scripts/run-heliodor-bench.sh"
      - "scripts/tests/convert-heliodor-bench.sh"
      - "scripts/tests/run-heliodor-bench-results.sh"
      - "scripts/tests/run-heliodor-bench-gate.sh"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      suite_test:
        description: Run only this Linux suite test (empty runs the full suite)
        type: string
        default: ""
      suite_runner:
        description: Run only this suite backend (empty runs all four)
        type: string
        default: ""
      suite_arch:
        description: Run only this suite architecture (empty runs both)
        type: string
        default: ""
      arm64_profile:
        description: Capture an ARM64 Linux boot profile without publishing history
        type: boolean
        default: false
      arm64_profile_run_id:
        description: Reuse profiling runners from this run ID (requires arm64_profile)
        type: string
        default: ""
      arm64_compare_run_id:
        description: Compare with runners from this run on the same ARM64 host (requires arm64_profile)
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

# Pull requests neither write benchmark history nor need to wait behind unrelated
# benchmark runs. Serialize master publishers with bench.yml, while develop uses
# a separate group so its dispatch cannot replace a pending master nightly run.
concurrency:
  group: ${{ (inputs.suite_test || inputs.suite_runner || inputs.suite_arch) && format('heliodor-suite-{0}-{1}-{2}-{3}', github.ref, inputs.suite_test, inputs.suite_runner, inputs.suite_arch) || inputs.arm64_profile && format('heliodor-arm64-profile-{0}', github.ref) || github.event_name == 'pull_request' && format('heliodor-pr-{0}', github.event.pull_request.number) || github.ref == 'refs/heads/develop' && 'heliodor-develop' || 'bench' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-dispatch:
    name: Validate dispatch inputs
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reject conflicting or invalid inputs
        env:
          ARM64_PROFILE: ${{ inputs.arm64_profile }}
          SUITE_TEST: ${{ inputs.suite_test }}
          SUITE_RUNNER: ${{ inputs.suite_runner }}
          SUITE_ARCH: ${{ inputs.suite_arch }}
        run: node scripts/heliodor-suite.mjs validate

  # PRs use this gate to avoid spending a dedicated ARM runner on unrelated
  # Rust changes. Detection failures fail open in arm64-linux-boot below.
  arm64-changes:
    name: Detect ARM64 changes
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      heliodor_arm64: ${{ steps.classify.outputs.heliodor_arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs "$BASE_SHA" "$HEAD_SHA"

  converter-test:
    name: Test Heliodor result conversion
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test benchmark conversion fixtures
        shell: bash
        run: |
          node --test scripts/heliodor-suite.test.mjs
          bash scripts/tests/convert-heliodor-bench.sh
          bash scripts/tests/run-heliodor-bench-results.sh
          bash scripts/tests/run-heliodor-bench-gate.sh

  heliodor:
    if: ${{ !inputs.arm64_profile && !inputs.suite_test && !inputs.suite_runner && !inputs.suite_arch }}
    # Keep the x86_64 gate on every workflow trigger. Only the ARM64 PR lane is
    # change-gated by arm64-changes below.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Capture benchmark host metadata
        shell: bash
        run: |
          {
            echo "snapshot=before"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_os=$RUNNER_OS"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo
            echo "[uname]"
            uname -a
            echo
            echo "[lscpu]"
            lscpu
            echo
            echo "[/proc/cpuinfo]"
            cat /proc/cpuinfo
            echo
            echo "[process affinity]"
            taskset -pc "$$"
            grep -E '^(Cpus_allowed|Cpus_allowed_list|Mems_allowed|Mems_allowed_list):' /proc/self/status
            echo
            echo "[/proc/stat]"
            cat /proc/stat
          } > "$RUNNER_TEMP/heliodor-host.txt"

      - name: Run fixed Heliodor correctness and measurement gate
        id: gate
        shell: bash
        run: |
          set +e
          set -o pipefail
          output="$RUNNER_TEMP/heliodor-output.txt"
          bash scripts/run-heliodor-bench.sh gate 2>&1 | tee "$output"
          status=${PIPESTATUS[0]}
          set -e
          cp "$output" heliodor-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

          result_file="$(find target/heliodor/results -path '*/gate_*/results.tsv' -type f -print -quit)"
          if [ -z "$result_file" ]; then
            echo "The Heliodor gate did not produce results.tsv" >&2
            exit 1
          fi
          echo "result_file=$result_file" >> "$GITHUB_OUTPUT"

      - name: Capture benchmark host final state
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "snapshot=after"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "[process affinity]"
            taskset -pc "$$"
            grep -E '^(Cpus_allowed|Cpus_allowed_list|Mems_allowed|Mems_allowed_list):' /proc/self/status
            echo
            echo "[/proc/stat]"
            cat /proc/stat
          } >> "$RUNNER_TEMP/heliodor-host.txt"
          cp "$RUNNER_TEMP/heliodor-host.txt" heliodor-host.txt

      - name: Convert dashboard metrics
        run: |
          node scripts/convert-heliodor-bench.mjs "${{ steps.gate.outputs.result_file }}" heliodor-converted.json --require-tiered
          node scripts/convert-heliodor-bench.mjs "${{ steps.gate.outputs.result_file }}" heliodor-jit.json --jit-only

      - name: Compare generated-JIT benchmark
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Heliodor Benchmarks
          tool: customSmallerIsBetter
          output-file-path: heliodor-jit.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: false
          alert-threshold: "110%"
          fail-on-alert: false
          comment-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Heliodor results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-benchmark
          path: |
            heliodor-host.txt
            heliodor-output.txt
            heliodor-converted.json
            heliodor-jit.json
            target/heliodor/results/gate_*/results.tsv
            target/heliodor/results/gate_*/*.log
            target/heliodor/results/gate_*/*.before
            target/heliodor/results/gate_*/*.after

      - name: Enforce fixed gate result
        if: always() && steps.gate.outputs.status != '0'
        run: exit 1

  arm64-linux-boot:
    name: ARM64 Linux boot
    needs: arm64-changes
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      (github.event_name == 'push' ||
      needs.arm64-changes.result != 'success' ||
      needs.arm64-changes.outputs.heliodor_arm64 == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      HELIODOR_DIR: ${{ github.workspace }}/target/heliodor-arm64/source
      HELIODOR_RESULTS_DIR: ${{ github.workspace }}/target/heliodor-arm64/results
      HELIODOR_TOOLS_DIR: ${{ github.workspace }}/target/heliodor-arm64/tools
      HELIODOR_RUNNERS: celox
      HELIODOR_TESTS: test_soc_linux_boot
      HELIODOR_TIMEOUT_SEC: "1200"
      HELIODOR_CELOX_CARGO_PROFILE: release
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Boot Linux with the native backend on ARM64
        shell: bash
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-arm64-output.txt

      - name: Upload ARM64 Linux boot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-arm64-linux-boot
          path: |
            heliodor-arm64-output.txt
            target/heliodor-arm64/results/results.tsv
            target/heliodor-arm64/results/*.log

  arm64-linux-boot-full:
    name: Nightly ARM64 Linux boot
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.suite_test && !inputs.suite_runner && !inputs.suite_arch)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      HELIODOR_DIR: ${{ github.workspace }}/target/heliodor-arm64/source
      HELIODOR_RESULTS_DIR: ${{ github.workspace }}/target/heliodor-arm64/results
      HELIODOR_TOOLS_DIR: ${{ github.workspace }}/target/heliodor-arm64/tools
      HELIODOR_TESTS: test_soc_linux_boot
      HELIODOR_CELOX_CARGO_PROFILE: release
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
        if: ${{ !inputs.arm64_profile || inputs.arm64_profile_run_id == '' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.arm64_profile || inputs.arm64_profile_run_id == '' }}

      - name: Reuse ARM64 profiling runners
        if: inputs.arm64_profile && inputs.arm64_profile_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: heliodor-arm64-profiling-runners
          path: target/release
          run-id: ${{ inputs.arm64_profile_run_id }}
          github-token: ${{ github.token }}

      - name: Prepare ARM64 profiling
        if: inputs.arm64_profile
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
          sudo sysctl kernel.perf_event_paranoid=-1
          perf_bin=
          for candidate in /usr/lib/linux-tools/*/perf; do
            if [[ -x "$candidate" ]]; then perf_bin="$candidate"; fi
          done
          test -n "$perf_bin"
          echo "PERF_BIN=$perf_bin" >> "$GITHUB_ENV"
          lscpu | tee heliodor-arm64-host.txt
          mkdir -p "$HELIODOR_RESULTS_DIR"
          echo "CELOX_PERF_MAP=1" >> "$GITHUB_ENV"

      - name: Boot Linux with synchronous and tiered backends on ARM64
        if: ${{ !inputs.arm64_profile || inputs.arm64_profile_run_id == '' }}
        shell: bash
        env:
          HELIODOR_RUNNERS: ${{ inputs.arm64_profile && 'celox' || 'veryl-cc-sync celox celox-tiered veryl-cc-tiered' }}
          HELIODOR_TIMEOUT_SEC: "1200"
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-arm64-output.txt

      - name: Download ARM64 comparison runner
        if: inputs.arm64_profile && inputs.arm64_compare_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: heliodor-arm64-profiling-runners
          path: target/heliodor-arm64/baseline-runners
          run-id: ${{ inputs.arm64_compare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare ARM64 compilation and execution
        if: inputs.arm64_profile && inputs.arm64_compare_run_id != ''
        shell: bash
        run: |
          source scripts/run-heliodor-bench.sh
          trap cleanup_heliodor_fallback EXIT
          prepare
          baseline_runner="$GITHUB_WORKSPACE/target/heliodor-arm64/baseline-runners/celox-heliodor"
          veryl_runner="$GITHUB_WORKSPACE/target/heliodor-arm64/baseline-runners/veryl-heliodor"
          veryl_cache="$GITHUB_WORKSPACE/target/heliodor-arm64/compare-veryl-cache"
          chmod +x "$baseline_runner" "$CELOX_RUNNER_BIN"
          if [[ -f "$veryl_runner" ]]; then chmod +x "$veryl_runner"; fi
          collect_test_source_files test_soc_linux_boot sources
          args=()
          for source in "${sources[@]}"; do args+=(--source-file "$source"); done
          cd "$HELIODOR_DIR"
          for comparison_round in 1 2 3; do
            order=(baseline candidate)
            if (( comparison_round % 2 == 0 )); then order=(candidate baseline); fi
            if [[ -x "$veryl_runner" ]]; then
              case "$comparison_round" in
                1) order=(baseline candidate veryl) ;;
                2) order=(veryl candidate baseline) ;;
                3) order=(baseline veryl candidate) ;;
              esac
            fi
            for label in "${order[@]}"; do
              runner="$CELOX_RUNNER_BIN"
              if [[ "$label" == baseline ]]; then runner="$baseline_runner"; fi
              log="$HELIODOR_RESULTS_DIR/compare-$label-$comparison_round.log"
              if [[ "$label" == veryl ]]; then
                env VERYL_AOT_CACHE_DIR="$veryl_cache" \
                  timeout 1200 "$veryl_runner" --project "$HELIODOR_DIR" --test test_soc_linux_boot \
                  "${args[@]}" > "$log" 2>&1
              else
                timeout 1200 "$runner" --project "$HELIODOR_DIR" --test test_soc_linux_boot \
                  --backend native --opt-level o2 "${args[@]}" > "$log" 2>&1
              fi
              echo "comparison=$label round=$comparison_round"
              tail -n 4 "$log"
            done
          done

      - name: Capture ARM64 profile
        if: inputs.arm64_profile
        shell: bash
        run: |
          source scripts/run-heliodor-bench.sh
          trap cleanup_heliodor_fallback EXIT
          prepare
          chmod +x "$CELOX_RUNNER_BIN"
          collect_test_source_files test_soc_linux_boot sources
          args=()
          for source in "${sources[@]}"; do args+=(--source-file "$source"); done
          cd "$HELIODOR_DIR"
          "$PERF_BIN" record -e cpu-clock:u -F 997 -o "$HELIODOR_RESULTS_DIR/perf.data" -- \
            timeout 1200 "$CELOX_RUNNER_BIN" --project "$HELIODOR_DIR" --test test_soc_linux_boot \
            --backend native --opt-level o2 "${args[@]}" \
            --dump-ir-dir "$HELIODOR_RESULTS_DIR/profile-ir" --dump-ir-and-run \
            > "$HELIODOR_RESULTS_DIR/profile-linux.log" 2>&1

      - name: Summarize ARM64 profile
        if: inputs.arm64_profile
        shell: bash
        run: |
          cp /tmp/perf-*.map "$HELIODOR_RESULTS_DIR/"
          "$PERF_BIN" report --stdio --no-children --percent-limit 0.2 -i "$HELIODOR_RESULTS_DIR/perf.data" | tee "$HELIODOR_RESULTS_DIR/perf-report.txt"
          "$PERF_BIN" script -i "$HELIODOR_RESULTS_DIR/perf.data" -F ip,sym,dso > "$HELIODOR_RESULTS_DIR/perf-samples.txt"

      - name: Upload ARM64 profiling runners
        if: inputs.arm64_profile && always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-arm64-profiling-runners
          retention-days: 7
          path: |
            target/release/celox-heliodor
            target/release/veryl-heliodor

      - name: Upload nightly ARM64 Linux boot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-arm64-linux-boot-full
          path: |
            heliodor-arm64-output.txt
            target/heliodor-arm64/results/results.tsv
            target/heliodor-arm64/results/*.log
            target/heliodor-arm64/results/perf*
            target/heliodor-arm64/results/profile-ir/mir.txt
            target/heliodor-arm64/results/profile-ir/native_optimized.sir
            heliodor-arm64-host.txt

  linux-suite-matrix:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.arm64_profile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: matrix
        env:
          SUITE_TEST: ${{ inputs.suite_test }}
          SUITE_RUNNER: ${{ inputs.suite_runner }}
          SUITE_ARCH: ${{ inputs.suite_arch }}
        run: echo "matrix=$(node scripts/heliodor-suite.mjs matrix)" >> "$GITHUB_OUTPUT"

  linux-suite:
    name: Linux suite (${{ matrix.arch }}, ${{ matrix.test }}, ${{ matrix.runner }})
    needs: linux-suite-matrix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.linux-suite-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      # Keep expanded workloads separate from the historical fixed gate.
      HELIODOR_REF: 6285682fa0a514077da9d17fee385c7841160025
      HELIODOR_SUITE: "1"
      HELIODOR_TESTS: ${{ matrix.test }}
      HELIODOR_RUNNERS: ${{ matrix.runner }}
      HELIODOR_TIMEOUT_SEC: ${{ matrix.timeout_sec }}
      HELIODOR_CELOX_CARGO_PROFILE: release
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Record host
        run: |
          uname -a > heliodor-suite-host.txt
          lscpu >> heliodor-suite-host.txt
          free -h >> heliodor-suite-host.txt
          swapon --show >> heliodor-suite-host.txt
          df -h >> heliodor-suite-host.txt
      - name: Run complete workload
        shell: bash
        run: set -o pipefail && /usr/bin/time -v bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-suite-output.txt
      - name: Verify tiered promotion
        if: matrix.runner == 'celox-tiered'
        shell: bash
        run: |
          source scripts/run-heliodor-bench.sh
          logs=(target/heliodor/results/*_celox-tiered_*.log)
          test "${#logs[@]}" -eq 1
          validate_gate_tiered_stats "${logs[0]}" "$HELIODOR_TESTS"
      - name: Upload workload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-suite-${{ matrix.arch }}-${{ matrix.test }}-${{ matrix.runner }}
          path: |
            heliodor-suite-host.txt
            heliodor-suite-output.txt
            target/heliodor/results/results.tsv
            target/heliodor/results/*.log

  publish-linux-boot:
    name: Publish Linux boot benchmarks
    if: >-
      !cancelled() &&
      needs.heliodor.result == 'success' &&
      needs.arm64-linux-boot-full.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      !inputs.arm64_profile &&
      github.ref == 'refs/heads/master'
    needs: [heliodor, arm64-linux-boot-full, linux-suite]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: heliodor-benchmark
          path: artifacts/x86_64

      - uses: actions/download-artifact@v8
        with:
          name: heliodor-arm64-linux-boot-full
          path: artifacts/native-aarch64

      - name: Convert backend and CPU architecture results
        shell: bash
        run: |
          native_results="$(find artifacts/x86_64 -path '*/gate_*/results.tsv' -type f -print -quit)"
          arm64_results="$(find artifacts/native-aarch64 -name results.tsv -type f -print -quit)"
          if [[ -z "$native_results" || -z "$arm64_results" ]]; then
            echo "Could not find every Linux boot results.tsv artifact" >&2
            exit 1
          fi
          node scripts/convert-heliodor-bench.mjs \
            "$native_results" heliodor-published.json \
            --arm64-results "$arm64_results" --require-tiered

      - uses: actions/download-artifact@v8
        if: needs.linux-suite.result == 'success' && !inputs.suite_test && !inputs.suite_runner && !inputs.suite_arch
        with:
          pattern: heliodor-suite-*
          path: artifacts/suite

      - name: Convert expanded Linux suite
        if: needs.linux-suite.result == 'success' && !inputs.suite_test && !inputs.suite_runner && !inputs.suite_arch
        shell: bash
        run: |
          node scripts/heliodor-suite.mjs merge artifacts/suite suite
          node scripts/convert-heliodor-bench.mjs suite-x86_64.tsv heliodor-suite.json --arm64-results suite-aarch64.tsv --require-tiered --suite
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const read = (path) => JSON.parse(readFileSync(path, "utf8"));
            writeFileSync("heliodor-published.json", JSON.stringify([...read("heliodor-published.json"), ...read("heliodor-suite.json")]));
          '

      - name: Store Heliodor benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Heliodor Benchmarks
          tool: customSmallerIsBetter
          output-file-path: heliodor-published.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: "110%"
          fail-on-alert: false
          comment-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

  heliodor-head:
    name: Heliodor HEAD compatibility
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' &&
       !inputs.suite_test && !inputs.suite_runner && !inputs.suite_arch)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HELIODOR_DIR: target/heliodor-head/source
      HELIODOR_RESULTS_DIR: target/heliodor-head/results
      HELIODOR_TOOLS_DIR: target/heliodor-head/tools
      HELIODOR_RUNNERS: celox
      HELIODOR_TESTS: test_soc_linux_boot
      HELIODOR_TIMEOUT_SEC: "420"
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Resolve Heliodor HEAD
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          heliodor_revision="$(git ls-remote https://github.com/dalance/heliodor.git HEAD | cut -f1)"
          if [[ ! "$heliodor_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve dalance/heliodor HEAD" >&2
            exit 1
          fi
          echo "HELIODOR_REF=$heliodor_revision" >> "$GITHUB_ENV"
          echo "$heliodor_revision" > heliodor-head-ref.txt
          echo "Testing Heliodor HEAD at $heliodor_revision"
          echo "### Heliodor HEAD compatibility" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream revision: \`$heliodor_revision\`" >> "$GITHUB_STEP_SUMMARY"
          source scripts/run-heliodor-bench.sh
          skip_reason="$(heliodor_head_skip_reason "$heliodor_revision")"
          if [[ -n "$skip_reason" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$skip_reason"
            printf 'SKIPPED: %s\n' "$skip_reason" | tee heliodor-head-output.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Heliodor HEAD compatibility gate
        if: steps.upstream.outputs.run == 'true'
        shell: bash
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-head-output.txt

      - name: Upload Heliodor HEAD results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-head-compatibility
          path: |
            heliodor-head-ref.txt
            heliodor-head-output.txt
            target/heliodor-head/results/results.tsv
            target/heliodor-head/results/*.log
