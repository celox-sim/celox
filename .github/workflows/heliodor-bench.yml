name: Heliodor Benchmark

on:
  workflow_dispatch:
    inputs:
      arm64_profile:
        description: Measure native ARM images without publishing benchmark history
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: heliodor-arm64-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Compare native ARM images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      HELIODOR_DIR: ${{ github.workspace }}/target/heliodor-arm64/source
      HELIODOR_RESULTS_DIR: ${{ github.workspace }}/target/heliodor-arm64/results
      HELIODOR_TOOLS_DIR: ${{ github.workspace }}/target/heliodor-arm64/tools
      HELIODOR_CELOX_CARGO_PROFILE: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: heliodor-arm64-profiling-runners
          path: target/release
          run-id: 34260390087
          github-token: ${{ github.token }}
      - name: Record ARM host
        run: lscpu
      - name: Compare native images and synchronous Veryl-CC
        run: bash scripts/compare-heliodor-arm64-images.sh
      - name: Upload image comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-arm64-image-comparison
          path: |
            target/heliodor-arm64/results/*.log
            scripts/arm64-images/manifest.json
