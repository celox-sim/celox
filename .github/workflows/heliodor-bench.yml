name: Heliodor Benchmark

on:
  workflow_dispatch:
    inputs:
      arm64_profile:
        description: Measure native ARM images without publishing benchmark history
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: heliodor-arm64-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Compare native ARM images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      HELIODOR_DIR: ${{ github.workspace }}/target/heliodor-arm64/source
      HELIODOR_RESULTS_DIR: ${{ github.workspace }}/target/heliodor-arm64/results
      HELIODOR_TOOLS_DIR: ${{ github.workspace }}/target/heliodor-arm64/tools
      HELIODOR_CELOX_CARGO_PROFILE: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: heliodor-arm64-profiling-runners
          path: target/release
          run-id: 34260390087
          github-token: ${{ github.token }}
      - name: Record ARM host
        run: lscpu
      - name: Compare native images and synchronous Veryl-CC
        run: bash scripts/compare-heliodor-arm64-images.sh
      - name: Profile the candidate image
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
          sudo sysctl kernel.perf_event_paranoid=-1
          perf_bin=
          for candidate in /usr/lib/linux-tools/*/perf; do
            if [[ -x "$candidate" ]]; then perf_bin="$candidate"; fi
          done
          test -n "$perf_bin"
          cd "$HELIODOR_DIR"
          CELOX_PERF_MAP=1 "$perf_bin" record -e cpu-clock:u -F 997 -o "$HELIODOR_RESULTS_DIR/perf.data" -- \
            "$GITHUB_WORKSPACE/target/release/celox-heliodor" \
            --project "$HELIODOR_DIR" --test test_soc_linux_boot --backend native --opt-level o2 \
            --native-image-input "$GITHUB_WORKSPACE/scripts/arm64-images/candidate.native-image" \
            > "$HELIODOR_RESULTS_DIR/profile-linux.log" 2>&1
          cp /tmp/perf-*.map "$HELIODOR_RESULTS_DIR/"
          "$perf_bin" report --stdio --no-children --percent-limit 0.2 -i "$HELIODOR_RESULTS_DIR/perf.data" > "$HELIODOR_RESULTS_DIR/perf-report.txt"
          "$perf_bin" script -i "$HELIODOR_RESULTS_DIR/perf.data" -F ip,sym,dso > "$HELIODOR_RESULTS_DIR/perf-samples.txt"
      - name: Upload image comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-arm64-image-comparison
          path: |
            target/heliodor-arm64/results/*.log
            target/heliodor-arm64/results/perf*.map
            target/heliodor-arm64/results/perf-*.txt
            scripts/arm64-images/manifest.json
