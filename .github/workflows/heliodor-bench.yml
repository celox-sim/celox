name: Heliodor Benchmark

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/actions/setup-rust/**"
      - ".github/workflows/heliodor-bench.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "!crates/celox-napi/package.json"
      - "scripts/convert-heliodor-bench.mjs"
      - "scripts/run-heliodor-bench.sh"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

# Pull requests neither write benchmark history nor need to wait behind unrelated
# benchmark runs. Keep only the master/manual publisher serialized with bench.yml.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('heliodor-pr-{0}', github.event.pull_request.number) || github.event_name == 'schedule' && 'heliodor-head' || 'bench' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}

jobs:
  heliodor:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Capture benchmark host metadata
        shell: bash
        run: |
          {
            echo "snapshot=before"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_os=$RUNNER_OS"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo
            echo "[uname]"
            uname -a
            echo
            echo "[lscpu]"
            lscpu
            echo
            echo "[/proc/cpuinfo]"
            cat /proc/cpuinfo
            echo
            echo "[process affinity]"
            taskset -pc "$$"
            grep -E '^(Cpus_allowed|Cpus_allowed_list|Mems_allowed|Mems_allowed_list):' /proc/self/status
            echo
            echo "[/proc/stat]"
            cat /proc/stat
          } > "$RUNNER_TEMP/heliodor-host.txt"

      - name: Run fixed Heliodor correctness and measurement gate
        id: gate
        shell: bash
        run: |
          set +e
          set -o pipefail
          output="$RUNNER_TEMP/heliodor-output.txt"
          bash scripts/run-heliodor-bench.sh gate 2>&1 | tee "$output"
          status=${PIPESTATUS[0]}
          set -e
          cp "$output" heliodor-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

          result_file="$(find target/heliodor/results -path '*/gate_*/results.tsv' -type f -print -quit)"
          if [ -z "$result_file" ]; then
            echo "The Heliodor gate did not produce results.tsv" >&2
            exit 1
          fi
          echo "result_file=$result_file" >> "$GITHUB_OUTPUT"

      - name: Capture benchmark host final state
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "snapshot=after"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "[process affinity]"
            taskset -pc "$$"
            grep -E '^(Cpus_allowed|Cpus_allowed_list|Mems_allowed|Mems_allowed_list):' /proc/self/status
            echo
            echo "[/proc/stat]"
            cat /proc/stat
          } >> "$RUNNER_TEMP/heliodor-host.txt"
          cp "$RUNNER_TEMP/heliodor-host.txt" heliodor-host.txt

      - name: Convert dashboard metrics
        run: |
          node scripts/convert-heliodor-bench.mjs "${{ steps.gate.outputs.result_file }}" heliodor-converted.json
          node scripts/convert-heliodor-bench.mjs "${{ steps.gate.outputs.result_file }}" heliodor-jit.json --jit-only

      - name: Store Heliodor benchmark history
        if: github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Heliodor Benchmarks
          tool: customSmallerIsBetter
          output-file-path: heliodor-converted.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          alert-threshold: "110%"
          fail-on-alert: false
          comment-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare generated-JIT benchmark
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Heliodor Benchmarks
          tool: customSmallerIsBetter
          output-file-path: heliodor-jit.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: false
          alert-threshold: "110%"
          fail-on-alert: false
          comment-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Heliodor results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-benchmark
          path: |
            heliodor-host.txt
            heliodor-output.txt
            heliodor-converted.json
            heliodor-jit.json
            target/heliodor/results/gate_*/results.tsv
            target/heliodor/results/gate_*/*.log
            target/heliodor/results/gate_*/*.before
            target/heliodor/results/gate_*/*.after

      - name: Enforce fixed gate result
        if: always() && steps.gate.outputs.status != '0'
        run: exit 1

  cranelift-linux-boot:
    name: Cranelift Linux boot
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HELIODOR_DIR: ${{ github.workspace }}/target/heliodor-cranelift/source
      HELIODOR_RESULTS_DIR: ${{ github.workspace }}/target/heliodor-cranelift/results
      HELIODOR_TOOLS_DIR: ${{ github.workspace }}/target/heliodor-cranelift/tools
      HELIODOR_RUNNERS: celox-cranelift
      HELIODOR_TESTS: test_soc_linux_boot
      HELIODOR_TIMEOUT_SEC: "1200"
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Boot Linux with the Cranelift backend
        shell: bash
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-cranelift-output.txt

      - name: Upload Cranelift Linux boot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-cranelift-linux-boot
          path: |
            heliodor-cranelift-output.txt
            target/heliodor-cranelift/results/results.tsv
            target/heliodor-cranelift/results/*.log

  arm64-linux-boot:
    name: ARM64 Linux boot
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      HELIODOR_DIR: ${{ github.workspace }}/target/heliodor-arm64/source
      HELIODOR_RESULTS_DIR: ${{ github.workspace }}/target/heliodor-arm64/results
      HELIODOR_TOOLS_DIR: ${{ github.workspace }}/target/heliodor-arm64/tools
      HELIODOR_RUNNERS: celox
      HELIODOR_TESTS: test_soc_linux_boot
      HELIODOR_TIMEOUT_SEC: "1200"
      HELIODOR_CELOX_CARGO_FEATURES: experimental-arm64-backend
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Boot Linux with the ARM64 backend
        shell: bash
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-arm64-output.txt

      - name: Upload ARM64 Linux boot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-arm64-linux-boot
          path: |
            heliodor-arm64-output.txt
            target/heliodor-arm64/results/results.tsv
            target/heliodor-arm64/results/*.log

  heliodor-head:
    name: Heliodor HEAD compatibility
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HELIODOR_DIR: target/heliodor-head/source
      HELIODOR_RESULTS_DIR: target/heliodor-head/results
      HELIODOR_TOOLS_DIR: target/heliodor-head/tools
      HELIODOR_RUNNERS: celox
      HELIODOR_TESTS: test_soc_linux_boot
      HELIODOR_TIMEOUT_SEC: "420"
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Resolve Heliodor HEAD
        shell: bash
        run: |
          set -euo pipefail
          heliodor_revision="$(git ls-remote https://github.com/dalance/heliodor.git HEAD | cut -f1)"
          if [[ ! "$heliodor_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve dalance/heliodor HEAD" >&2
            exit 1
          fi
          echo "HELIODOR_REF=$heliodor_revision" >> "$GITHUB_ENV"
          echo "$heliodor_revision" > heliodor-head-ref.txt
          echo "Testing Heliodor HEAD at $heliodor_revision"
          echo "### Heliodor HEAD compatibility" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream revision: \`$heliodor_revision\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Heliodor HEAD compatibility gate
        shell: bash
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-head-output.txt

      - name: Upload Heliodor HEAD results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-head-compatibility
          path: |
            heliodor-head-ref.txt
            heliodor-head-output.txt
            target/heliodor-head/results/results.tsv
            target/heliodor-head/results/*.log
