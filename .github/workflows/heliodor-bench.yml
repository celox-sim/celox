name: Heliodor Benchmark

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/actions/setup-rust/**"
      - ".github/workflows/heliodor-bench.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "!crates/celox-napi/package.json"
      - "scripts/convert-heliodor-bench.mjs"
      - "scripts/ci-changes.mjs"
      - "scripts/ci-changes.test.mjs"
      - "scripts/run-heliodor-bench.sh"
      - "scripts/tests/convert-heliodor-bench.sh"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

# Pull requests neither write benchmark history nor need to wait behind unrelated
# benchmark runs. Serialize master publishers with bench.yml, while develop uses
# a separate group so its dispatch cannot replace a pending master nightly run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('heliodor-pr-{0}', github.event.pull_request.number) || github.ref == 'refs/heads/develop' && 'heliodor-develop' || 'bench' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs use this gate to avoid spending a dedicated ARM runner on unrelated
  # Rust changes. Detection failures fail open in arm64-linux-boot below.
  arm64-changes:
    name: Detect ARM64 changes
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      heliodor_arm64: ${{ steps.classify.outputs.heliodor_arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs "$BASE_SHA" "$HEAD_SHA"

  converter-test:
    name: Test Heliodor result conversion
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test benchmark conversion fixtures
        shell: bash
        run: bash scripts/tests/convert-heliodor-bench.sh

  heliodor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Capture benchmark host metadata
        shell: bash
        run: |
          {
            echo "snapshot=before"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_os=$RUNNER_OS"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo
            echo "[uname]"
            uname -a
            echo
            echo "[lscpu]"
            lscpu
            echo
            echo "[/proc/cpuinfo]"
            cat /proc/cpuinfo
            echo
            echo "[process affinity]"
            taskset -pc "$$"
            grep -E '^(Cpus_allowed|Cpus_allowed_list|Mems_allowed|Mems_allowed_list):' /proc/self/status
            echo
            echo "[/proc/stat]"
            cat /proc/stat
          } > "$RUNNER_TEMP/heliodor-host.txt"

      - name: Run fixed Heliodor correctness and measurement gate
        id: gate
        shell: bash
        run: |
          set +e
          set -o pipefail
          output="$RUNNER_TEMP/heliodor-output.txt"
          bash scripts/run-heliodor-bench.sh gate 2>&1 | tee "$output"
          status=${PIPESTATUS[0]}
          set -e
          cp "$output" heliodor-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

          result_file="$(find target/heliodor/results -path '*/gate_*/results.tsv' -type f -print -quit)"
          if [ -z "$result_file" ]; then
            echo "The Heliodor gate did not produce results.tsv" >&2
            exit 1
          fi
          echo "result_file=$result_file" >> "$GITHUB_OUTPUT"

          runner_file="$(dirname "$result_file")/celox-target/release/celox-heliodor"
          if [ ! -x "$runner_file" ]; then
            echo "The Heliodor gate did not produce an executable Celox runner" >&2
            exit 1
          fi
          echo "runner_file=$(realpath -e "$runner_file")" >> "$GITHUB_OUTPUT"

      - name: Boot Linux with the Cranelift backend on the same host
        if: steps.gate.outputs.status == '0'
        shell: bash
        env:
          HELIODOR_DIR: ${{ github.workspace }}/target/heliodor/source
          HELIODOR_RESULTS_DIR: ${{ github.workspace }}/target/heliodor/results/cranelift-x86_64
          HELIODOR_TOOLS_DIR: ${{ github.workspace }}/target/heliodor/tools
          HELIODOR_RUNNERS: celox-cranelift
          HELIODOR_TESTS: test_soc_linux_boot
          HELIODOR_TIMEOUT_SEC: "1200"
          HELIODOR_CELOX_CARGO_PROFILE: release
          HELIODOR_BUILD_CELOX_RUNNER: "0"
          CELOX_RUNNER_BIN: ${{ steps.gate.outputs.runner_file }}
          CELOX_OPT_LEVEL: O2
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-cranelift-output.txt

      - name: Capture benchmark host final state
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "snapshot=after"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "[process affinity]"
            taskset -pc "$$"
            grep -E '^(Cpus_allowed|Cpus_allowed_list|Mems_allowed|Mems_allowed_list):' /proc/self/status
            echo
            echo "[/proc/stat]"
            cat /proc/stat
          } >> "$RUNNER_TEMP/heliodor-host.txt"
          cp "$RUNNER_TEMP/heliodor-host.txt" heliodor-host.txt

      - name: Convert dashboard metrics
        run: |
          node scripts/convert-heliodor-bench.mjs "${{ steps.gate.outputs.result_file }}" heliodor-converted.json
          node scripts/convert-heliodor-bench.mjs "${{ steps.gate.outputs.result_file }}" heliodor-jit.json --jit-only

      - name: Compare generated-JIT benchmark
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Heliodor Benchmarks
          tool: customSmallerIsBetter
          output-file-path: heliodor-jit.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: false
          alert-threshold: "110%"
          fail-on-alert: false
          comment-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Heliodor results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-benchmark
          path: |
            heliodor-host.txt
            heliodor-output.txt
            heliodor-cranelift-output.txt
            heliodor-converted.json
            heliodor-jit.json
            target/heliodor/results/gate_*/results.tsv
            target/heliodor/results/gate_*/*.log
            target/heliodor/results/gate_*/*.before
            target/heliodor/results/gate_*/*.after
            target/heliodor/results/cranelift-x86_64/results.tsv
            target/heliodor/results/cranelift-x86_64/*.log

      - name: Enforce fixed gate result
        if: always() && steps.gate.outputs.status != '0'
        run: exit 1

  arm64-linux-boot:
    name: ARM64 Linux boot
    needs: arm64-changes
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      (github.event_name == 'push' ||
      needs.arm64-changes.result != 'success' ||
      needs.arm64-changes.outputs.heliodor_arm64 == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      HELIODOR_DIR: ${{ github.workspace }}/target/heliodor-arm64/source
      HELIODOR_RESULTS_DIR: ${{ github.workspace }}/target/heliodor-arm64/results
      HELIODOR_TOOLS_DIR: ${{ github.workspace }}/target/heliodor-arm64/tools
      HELIODOR_RUNNERS: celox
      HELIODOR_TESTS: test_soc_linux_boot
      HELIODOR_TIMEOUT_SEC: "1200"
      HELIODOR_CELOX_CARGO_PROFILE: release
      HELIODOR_CELOX_CARGO_FEATURES: experimental-arm64-backend
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Boot Linux with the native backend on ARM64
        shell: bash
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-arm64-output.txt

      - name: Upload ARM64 Linux boot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-arm64-linux-boot
          path: |
            heliodor-arm64-output.txt
            target/heliodor-arm64/results/results.tsv
            target/heliodor-arm64/results/*.log

  arm64-linux-boot-full:
    name: Nightly ARM64 Linux boot
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      HELIODOR_DIR: ${{ github.workspace }}/target/heliodor-arm64/source
      HELIODOR_RESULTS_DIR: ${{ github.workspace }}/target/heliodor-arm64/results
      HELIODOR_TOOLS_DIR: ${{ github.workspace }}/target/heliodor-arm64/tools
      HELIODOR_TESTS: test_soc_linux_boot
      HELIODOR_CELOX_CARGO_PROFILE: release
      HELIODOR_CELOX_CARGO_FEATURES: experimental-arm64-backend
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Boot Linux with Veryl-CC and the native backend on ARM64
        shell: bash
        env:
          HELIODOR_RUNNERS: veryl-cc-sync celox
          HELIODOR_TIMEOUT_SEC: "1200"
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-arm64-output.txt

      - name: Boot Linux with the Cranelift backend on ARM64
        shell: bash
        env:
          HELIODOR_RUNNERS: celox-cranelift
          HELIODOR_TIMEOUT_SEC: "1800"
          HELIODOR_BUILD_CELOX_RUNNER: "0"
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-arm64-cranelift-output.txt

      - name: Upload nightly ARM64 Linux boot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-arm64-linux-boot-full
          path: |
            heliodor-arm64-output.txt
            heliodor-arm64-cranelift-output.txt
            target/heliodor-arm64/results/results.tsv
            target/heliodor-arm64/results/*.log

  publish-linux-boot:
    name: Publish Linux boot benchmarks
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    needs: [heliodor, arm64-linux-boot-full]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: heliodor-benchmark
          path: artifacts/x86_64

      - uses: actions/download-artifact@v8
        with:
          name: heliodor-arm64-linux-boot-full
          path: artifacts/native-aarch64

      - name: Convert backend and CPU architecture results
        shell: bash
        run: |
          native_results="$(find artifacts/x86_64 -path '*/gate_*/results.tsv' -type f -print -quit)"
          cranelift_results="$(find artifacts/x86_64 -path '*/cranelift-x86_64/results.tsv' -type f -print -quit)"
          arm64_results="$(find artifacts/native-aarch64 -name results.tsv -type f -print -quit)"
          if [[ -z "$native_results" || -z "$cranelift_results" || -z "$arm64_results" ]]; then
            echo "Could not find every Linux boot results.tsv artifact" >&2
            exit 1
          fi
          node scripts/convert-heliodor-bench.mjs \
            "$native_results" heliodor-published.json \
            --cranelift-results "$cranelift_results" \
            --arm64-results "$arm64_results"

      - name: Store Heliodor benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Heliodor Benchmarks
          tool: customSmallerIsBetter
          output-file-path: heliodor-published.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: "110%"
          fail-on-alert: false
          comment-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

  heliodor-head:
    name: Heliodor HEAD compatibility
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HELIODOR_DIR: target/heliodor-head/source
      HELIODOR_RESULTS_DIR: target/heliodor-head/results
      HELIODOR_TOOLS_DIR: target/heliodor-head/tools
      HELIODOR_RUNNERS: celox
      HELIODOR_TESTS: test_soc_linux_boot
      HELIODOR_TIMEOUT_SEC: "420"
      CELOX_OPT_LEVEL: O2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Resolve Heliodor HEAD
        shell: bash
        run: |
          set -euo pipefail
          heliodor_revision="$(git ls-remote https://github.com/dalance/heliodor.git HEAD | cut -f1)"
          if [[ ! "$heliodor_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve dalance/heliodor HEAD" >&2
            exit 1
          fi
          echo "HELIODOR_REF=$heliodor_revision" >> "$GITHUB_ENV"
          echo "$heliodor_revision" > heliodor-head-ref.txt
          echo "Testing Heliodor HEAD at $heliodor_revision"
          echo "### Heliodor HEAD compatibility" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream revision: \`$heliodor_revision\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Heliodor HEAD compatibility gate
        shell: bash
        run: set -o pipefail && bash scripts/run-heliodor-bench.sh run 2>&1 | tee heliodor-head-output.txt

      - name: Upload Heliodor HEAD results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heliodor-head-compatibility
          path: |
            heliodor-head-ref.txt
            heliodor-head-output.txt
            target/heliodor-head/results/results.tsv
            target/heliodor-head/results/*.log
