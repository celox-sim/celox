name: hwverify

# Proof, editor, and pinned-Celox conformance gates imported from
# https://github.com/tignear/hwverify. The workspace crates are also built,
# linted, and unit-tested by ci.yml; this workflow runs hwverify's own gates.

on:
  push:
    branches: [master, develop]
    paths:
      - "crates/hwverify-*/**"
      - "hwverify/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/hwverify.yml"
  pull_request:
    paths:
      - "crates/hwverify-*/**"
      - "hwverify/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/hwverify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # The workspace release profile uses fat LTO for the simulator. hwverify's
  # gates hash the checker they build, so a faster profile changes nothing.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

defaults:
  run:
    working-directory: hwverify

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check local documentation links and headings
        run: python3 scripts/check_docs.py

  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Build the isolated editor worker
        run: cargo build --release --locked --bin hwverify-editor
      - name: Check bounded responses and reject deadlock and dropped-request mutants
        run: |
          cargo test --release --locked -p hwverify-rs --test responses --bin hwverify-editor
          cargo test --release --locked -p hwverify-verify acceptance_cover
      - name: Check LSP lifecycle and fresh proof outcomes over stdio
        run: python3 -m unittest editor.test_server -v
      - name: Install and check the pinned VS Code client
        run: |
          npm ci --prefix editor/vscode --ignore-scripts --no-audit --no-fund
          node --check editor/vscode/extension.js
          npm run test:unit --prefix editor/vscode
          npm run test:rpc --prefix editor/vscode
      - name: Install Extension Host display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0t64 libgbm1 libnss3 libasound2t64 libxshmfence1
      - name: Exercise real VS Code Extension Host with the checked Rust worker
        timeout-minutes: 5
        run: xvfb-run -a npm test --prefix editor/vscode

  # The conformance gates build a pinned Celox revision (0.8.2) with its
  # recorded toolchain, independently of the in-tree simulator.
  celox-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Reproduce source violations and AXI4-Lite protocol regressions with pinned Celox
        run: ./conformance/axi4lite/run_ci.sh "$RUNNER_TEMP/celox-replay"
      - name: Upload complete replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: celox-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/celox-replay/
          if-no-files-found: error
          retention-days: 14

  veryl-fv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          python3 --version
      - name: Extract, lower and verify the pinned Veryl corpus
        run: ./conformance/veryl/run_ci.sh "$RUNNER_TEMP/veryl-conformance"
      - name: Upload complete conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veryl-fv-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veryl-conformance/
          if-no-files-found: error
          retention-days: 14

  veryl-proof-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          python3 --version
      - name: Run all 665 original Rust cases with proof-backed reads
        run: ./conformance/veryl-proof/run_ci.sh "$RUNNER_TEMP/veryl-proof"
      - name: Verify symbolic Veryl pipeline against ISA and reject RTL mutants
        run: ./conformance/veryl-symbolic/run_ci.sh "$RUNNER_TEMP/veryl-symbolic"
      - name: Verify typed lemma candidates and proof-use diagnostics
        run: python3 -m audit.lemma_candidates.ci --out "$RUNNER_TEMP/lemma-candidates"
      - name: Verify selected RV32I architecture, memory, latency and mutations
        run: ./conformance/veryl-symbolic/run_rv32i_ci.sh "$RUNNER_TEMP/selected-rv32i"
      - name: Verify fixed automatic-proof held-outs and original-formula mutants
        run: ./conformance/veryl-symbolic/run_automatic_ci.sh "$RUNNER_TEMP/automatic-proof"
      - name: Verify checked equality sharing and retain explicit Unknown diagnostics
        run: |
          python3 -m unittest audit.equality_sharing.test_generate audit.equality_sharing.test_evidence audit.equality_sharing.test_ci
          python3 -m audit.equality_sharing.ci --checker target/release/hwverify-rs --out "$RUNNER_TEMP/equality-sharing"
      - name: Verify whole-word frontier controls and original-formula mutants
        run: |
          python3 -m unittest audit.word_frontier.test_generate audit.word_frontier.test_ci
          python3 -m audit.word_frontier.ci --checker target/release/hwverify-rs --expected-checker-sha256 "$(sha256sum target/release/hwverify-rs | cut -d' ' -f1)" --out "$RUNNER_TEMP/word-frontier"
      - name: Verify guarded word expansion and reject escaped guards
        run: |
          cargo test --release --locked -p hwverify-solver equality_sharing::tests
          python3 -m unittest audit.guarded_expansion.test_generate audit.guarded_expansion.test_ci
          python3 -m audit.guarded_expansion.ci --checker target/release/hwverify-rs --expected-checker-sha256 "$(sha256sum target/release/hwverify-rs | cut -d' ' -f1)" --out "$RUNNER_TEMP/guarded-expansion"
      - name: Upload proof and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veryl-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/veryl-proof/
            ${{ runner.temp }}/veryl-symbolic/
            ${{ runner.temp }}/selected-rv32i/
            ${{ runner.temp }}/automatic-proof/
            ${{ runner.temp }}/equality-sharing/
            ${{ runner.temp }}/word-frontier/
            ${{ runner.temp }}/guarded-expansion/
            ${{ runner.temp }}/lemma-candidates/
          if-no-files-found: error
          retention-days: 14
