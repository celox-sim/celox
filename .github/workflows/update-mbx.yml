name: Update mbx

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-mbx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: Update the mbx package input
        id: update
        run: |
          old_version="$(nix eval --raw .#mbx.version --no-update-lock-file)"
          nix flake update nix-packages
          new_version="$(nix eval --raw .#mbx.version --no-update-lock-file)"
          echo "old-version=$old_version" >> "$GITHUB_OUTPUT"
          echo "new-version=$new_version" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the updated package
        if: steps.update.outputs.changed == 'true'
        run: |
          nix flake check --no-build --all-systems --no-update-lock-file
          nix build --no-link --no-update-lock-file .#mbx
          nix run --no-update-lock-file .#mbx -- --version

      # App-authored PRs trigger the normal PR checks, unlike GITHUB_TOKEN.
      - name: Create automation app token
        if: steps.update.outputs.changed == 'true'
        id: automation-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the mbx pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.automation-token.outputs.token }}
          branch: automation/update-mbx
          base: ${{ github.event.repository.default_branch }}
          add-paths: flake.lock
          commit-message: "chore(deps): update mbx to ${{ steps.update.outputs.new-version }}"
          title: "chore(deps): update mbx to ${{ steps.update.outputs.new-version }}"
          body: |
            Update the pinned `tignear/nix-packages` input for mbx from
            `${{ steps.update.outputs.old-version }}` to `${{ steps.update.outputs.new-version }}`.

            Validated the locked flake for both Linux architectures and built
            and ran mbx on x86_64. The daily run also builds and runs the
            committed mbx on ARM64.
            Other flake inputs remain pinned. Package-definition changes may
            update the lock even when the mbx version is unchanged.

  # Not a merge gate: check the committed lock on both architectures daily.
  validate:
    name: Validate mbx (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Build and run the locked mbx package
        run: |
          nix build --no-link --no-update-lock-file .#mbx
          expected="$(nix eval --raw --no-update-lock-file .#mbx.version)"
          actual="$(nix run --no-update-lock-file .#mbx -- --version)"
          test "$actual" = "mbx $expected"
