name: Benchmark

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  # Keep all compared backends on the same VM. Separate jobs with the same
  # runs-on label can receive different CPU models and are not paired samples.
  bench-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_PROFILE_BENCH_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2

      - name: Record comparison host
        run: |
          {
            echo "runner_name=$RUNNER_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "boot_id=$(cat /proc/sys/kernel/random/boot_id)"
            uname -a
            lscpu
            free -h
          } > benchmark-host.txt

      # rust-cache prunes Criterion's sample data while retaining its baseline
      # directories, which makes Criterion try to compare against incomplete data.
      - name: Discard cached Criterion data
        run: rm -rf target/criterion

      - name: Run Rust benchmarks
        shell: bash
        run: set -o pipefail && cargo bench --locked -p celox --bench simulation --bench overhead --bench tiered -- --output-format bencher | tee rust-output.txt

      - uses: actions/upload-artifact@v7
        with:
          name: bench-rust
          path: rust-output.txt

      # Verilator benchmarks (C++ reference), after Rust has finished.
      - uses: veryl-lang/setup-verilator@v2

      - name: Install Google Benchmark
        run: sudo apt-get install -y libbenchmark-dev

      - name: Run Verilator benchmarks
        shell: bash
        run: set -o pipefail && bash scripts/run-verilator-bench.sh | tee verilator-output.txt

      - uses: actions/upload-artifact@v7
        with:
          name: bench-verilator
          path: verilator-output.txt

      # TypeScript benchmarks (Vitest), on the same comparison host.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Build NAPI (release)
        run: pnpm run build:napi:release

      - name: Build packages
        run: pnpm run build

      - name: Test TypeScript benchmark conversion
        run: node --test scripts/tests/convert-bench.test.mjs

      - name: Run TypeScript benchmarks
        run: pnpm --filter @celox-sim/celox bench --run --reporter=default --reporter=json --outputFile=ts-output.json

      - uses: actions/upload-artifact@v7
        with:
          name: bench-ts
          path: packages/celox/ts-output.json

      - name: Upload comparison host
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-host
          path: benchmark-host.txt

  # ── Convert & publish results ──
  publish:
    needs: bench-comparison
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Convert Rust benchmark output
        run: node scripts/convert-rust-bench.mjs artifacts/bench-rust/rust-output.txt rust-converted.json

      - name: Convert Verilator benchmark output
        run: node scripts/convert-verilator-bench.mjs artifacts/bench-verilator/verilator-output.txt verilator-converted.json

      - name: Convert TypeScript benchmark output
        run: node scripts/convert-bench.mjs artifacts/bench-ts/ts-output.json ts-converted.json

      - name: Store Rust benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmarks
          tool: customSmallerIsBetter
          output-file-path: rust-converted.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: false
          alert-threshold: "200%"
          comment-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Store Verilator benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Verilator Benchmarks
          tool: customSmallerIsBetter
          output-file-path: verilator-converted.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          skip-fetch-gh-pages: true
          auto-push: false
          alert-threshold: "200%"
          comment-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Store TypeScript benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TypeScript Benchmarks
          tool: customSmallerIsBetter
          output-file-path: ts-converted.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          skip-fetch-gh-pages: true
          auto-push: true
          alert-threshold: "200%"
          comment-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
