name: Lydite

# Proof, editor, and pinned-Celox conformance gates imported from
# https://github.com/tignear/hwverify. The workspace crates are also built,
# linted by ci.yml; this workflow owns Lydite tests and conformance gates.

on:
  # Only Lydite core gates run here. Celox bridge/proof replay is disabled.
  pull_request:
  merge_group:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  # A new push must not cancel the daily full run halfway through its corpus.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'changes' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # The workspace release profile uses fat LTO for the simulator. lydite's
  # gates hash the checker they build, so a faster profile changes nothing.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

defaults:
  run:
    working-directory: lydite

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      core: ${{ steps.scope.outputs.core }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected Lydite lanes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci-lydite-changes.mjs "$BASE_SHA" "$HEAD_SHA"

  rust:
    timeout-minutes: 30
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install recorded solver version
        run: python -m pip install z3-solver==5.1.0
      - name: Test affected Lydite packages and documentation
        run: |
          Z3_BIN="$(command -v z3)"
          export Z3_BIN
          cargo test --locked -p lydite -p lydite-ir -p lydite-solver -p lydite-syntax -p lydite-verify

  documentation:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check local documentation links and headings
        run: python3 scripts/check_docs.py

  editor:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Build the isolated editor worker
        run: cargo build --release --locked -p lydite --bin lydite-editor
      - name: Check bounded responses and reject deadlock and dropped-request mutants
        run: |
          cargo test --release --locked -p lydite --test responses --bin lydite-editor
          cargo test --release --locked -p lydite-verify acceptance_cover
      - name: Check LSP lifecycle and fresh proof outcomes over stdio
        run: python3 -m unittest editor.test_server -v
      - name: Install and check the pinned VS Code client
        run: |
          npm ci --prefix editor/vscode --ignore-scripts --no-audit --no-fund
          node --check editor/vscode/extension.js
          npm run test:unit --prefix editor/vscode
          npm run test:rpc --prefix editor/vscode
      - name: Install Extension Host display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0t64 libgbm1 libnss3 libasound2t64 libxshmfence1
      - name: Exercise real VS Code Extension Host with the checked Rust worker
        timeout-minutes: 5
        run: xvfb-run -a npm test --prefix editor/vscode

  # The narrow veryl gate checks lydite's own Veryl lowering against a pinned
  # upstream corpus.
  veryl-fv:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.core == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      # The conformance gates are pinned to Python 3.12.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Extract, lower and verify the pinned Veryl corpus
        run: ./conformance/veryl/run_ci.sh "$RUNNER_TEMP/veryl-conformance"
      - name: Upload complete conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veryl-fv-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veryl-conformance/
          if-no-files-found: error
          retention-days: 14

  result:
    name: Lydite checks
    needs: [changes, rust, documentation, editor, veryl-fv]
    if: always()
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every selected lane to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          assert needs["changes"]["result"] == "success", needs
          assert needs["changes"]["outputs"].get("core") in ("true", "false"), needs
          for job in ("rust", "documentation", "editor", "veryl-fv"):
              outputs = needs["changes"]["outputs"]
              selected = outputs.get("core") == "true"
              assert needs[job]["result"] == ("success" if selected else "skipped"), (job, needs[job])
          PYCODE

  # Report daily/manual core runs.
  report:
    name: Report Lydite validation
    needs: [changes, rust, documentation, editor, veryl-fv, result]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'master' || github.ref_name == 'develop') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Open, update, or close the Lydite issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_NAME: Lydite validation
        run: node scripts/report-full-ci.mjs
