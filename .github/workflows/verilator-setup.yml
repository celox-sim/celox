name: Verilator setup
on:
  pull_request:
    paths:
      - .github/actions/setup-verilator/**
      - .github/workflows/verilator-setup.yml
      - scripts/smoke-verilator-setup.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-verilator
        with:
          version: "5.052"
          revision: ea338be98e1e838d3518809ce8899f85a009963c
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install cocotb==2.1.0
      - run: python scripts/smoke-verilator-setup.py
  cached:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-verilator
        id: verilator
        with:
          version: "5.052"
          revision: ea338be98e1e838d3518809ce8899f85a009963c
      - name: Require an exact cache restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.verilator.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install cocotb==2.1.0
      - run: python scripts/smoke-verilator-setup.py
