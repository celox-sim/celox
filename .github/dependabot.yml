version: 2
updates:
  # Dependabot regenerates actions.lock together with workflow version updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /
    # Required by the schema; security updates are triggered by alerts.
    schedule:
      interval: daily
    # Disable version updates, while retaining security updates.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
